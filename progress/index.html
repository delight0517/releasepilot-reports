<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차실장 · 출시 현황판</title>
<meta name="description" content="등록된 앱들이 출시·수익화까지 어디쯤 왔는지, 다음에 무엇을 해야 하는지 한눈에 보는 현황판">
<link rel="icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#fbfaf7">
<style>
  :root {
    --bg: #fbfaf7; --card: #ffffff; --card-2: #f6f3ec; --line: #e9e3d6;
    --ink: #1d1b17; --ink-dim: #6b6a5f; --ink-faint: #a3a091;
    --accent: #c9711f; --accent-soft: #f6e6d3; --accent-ink: #7a4413;
    --good: #2f7a63; --good-soft: #dcefe8;
    --warn: #b3541e; --warn-soft: #fbe8dc;
    --launch: #4f7cac; --revenue: #2f7a63;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --shadow-1: 0 1px 2px rgba(29,27,23,0.05), 0 1px 1px rgba(29,27,23,0.03);
  }
  * { box-sizing: border-box; overflow-wrap: break-word; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 18px 90px; }
  .back-link {
    position: fixed; top: 16px; left: 16px; z-index: 5; font-family: var(--mono);
    font-size: 10.5px; color: var(--ink-faint); text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }

  /* ── 차실장 헤더 ─────────────────────────────────────────────── */
  .hero { padding: 68px 4px 8px; text-align: center; }
  .bot {
    width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 22px;
    background: var(--accent-soft); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
  }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 6vw, 38px); margin: 0 0 8px; }
  .hero .role { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent-ink); margin: 0 0 14px; }
  .hero p { margin: 0 auto; font-size: 14.5px; color: var(--ink-dim); max-width: 40ch; }

  /* ── 차실장 브리핑 ───────────────────────────────────────────── */
  .briefing {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 14px; padding: 18px 20px; margin-top: 28px;
  }
  .briefing h2 { font-family: var(--serif); font-weight: 400; font-size: 18px; margin: 0 0 10px; }
  .briefing p { font-size: 13.5px; color: var(--ink-dim); margin: 0 0 8px; line-height: 1.65; }
  .briefing p:last-child { margin-bottom: 0; }
  .briefing b { color: var(--ink); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 14px; margin-top: 48px; }
  .section-head h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0; }
  .section-head .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── 11단계 안내 — 막대를 보기 전에 "왜 이 순서인가"를 먼저 이해시킨다.
     사용자 요청: "단계마다의 설득을 교육시키는 방식으로" — 숫자만 던지지
     않고, 각 단계가 왜 필요한지 한 문장으로 설득한다. ──────────────────── */
  .stage-guide { display: flex; flex-direction: column; gap: 0; }
  .stage-item {
    display: flex; gap: 14px; padding: 16px 4px; border-bottom: 1px solid var(--line);
    align-items: flex-start;
  }
  .stage-item:last-child { border-bottom: none; }
  .stage-rail { display: flex; flex-direction: column; align-items: center; flex: none; width: 34px; }
  .stage-num {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: #fff; flex: none;
  }
  .stage-line { flex: 1; width: 2px; background: var(--line); margin-top: 4px; min-height: 12px; }
  .stage-body { flex: 1; padding-top: 2px; }
  .stage-top-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stage-name { font-size: 14.5px; font-weight: 700; }
  .stage-phase-tag {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 999px; font-weight: 700;
  }
  .stage-weight { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-left: auto; }
  .stage-persuade { font-size: 13px; color: var(--ink-dim); margin: 6px 0 0; line-height: 1.6; }
  .stage-item.is-reached .stage-num { opacity: 1; }
  .stage-item.is-future .stage-num { opacity: 0.35; }
  .stage-item.is-future .stage-name { color: var(--ink-faint); }
  .stage-item.is-future .stage-persuade { color: var(--ink-faint); }
  .stage-reached-badge {
    font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--good);
    background: var(--good-soft); border-radius: 999px; padding: 2px 8px; margin-left: 6px;
  }

  /* ── 앱별 진행 막대 ──────────────────────────────────────────── */
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow-1); }
  .app-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .app-name { font-size: 15.5px; font-weight: 700; }
  .app-pct { font-family: var(--mono); font-size: 13px; color: var(--accent-ink); font-weight: 700; margin-left: auto; }
  .app-stage { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; }

  .bar { height: 12px; border-radius: 999px; background: var(--card-2); overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .seg-build { background: var(--accent); }
  .seg-launch { background: var(--launch); }
  .seg-revenue { background: var(--revenue); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-family: var(--mono); font-size: 10px; padding: 4px 9px; border-radius: 999px;
    background: var(--card-2); color: var(--ink-dim); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
  .chip.good { background: var(--good-soft); color: var(--good); font-weight: 700; }

  .next { margin-top: 12px; padding: 11px 14px; background: var(--card-2); border-radius: 10px;
    font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; }
  .next b { color: var(--accent-ink); font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 3px; }

  .remaining { margin-top: 10px; font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; }

  .stale-toggle { margin-top: 18px; border: 1px dashed var(--line); border-radius: 14px; padding: 4px 16px; }
  .stale-toggle summary { cursor: pointer; padding: 12px 0; font-family: var(--mono); font-size: 11.5px;
    color: var(--ink-faint); letter-spacing: 0.02em; list-style: none; }
  .stale-toggle summary::-webkit-details-marker { display: none; }
  .stale-toggle summary::before { content: '▸ '; }
  .stale-toggle[open] summary::before { content: '▾ '; }
  .stale-toggle .app { opacity: 0.75; }

  .empty { font-size: 14px; color: var(--ink-faint); padding: 40px 4px; text-align: center; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10px; color: var(--ink-faint); text-align: center; }
  @media (max-width: 480px) { .app { padding: 16px; } }
</style>

<a class="back-link" href="../">‹ 허브로</a>
<div class="wrap">
  <div class="hero">
    <div class="bot">🤖</div>
    <p class="role">차실장 · Chief Cha</p>
    <h1>출시 현황판</h1>
    <p>등록된 앱이 수익화까지 어디쯤 왔는지, 지금 돌아와서 정확히 뭘 해야 하는지.</p>
  </div>

  <div class="briefing" id="briefing"></div>

  <div class="section-head"><h2>11단계 — 왜 이 순서인가</h2><span class="hint">Build → Launch → Revenue</span></div>
  <div class="stage-guide" id="stageGuide"></div>

  <div class="section-head"><h2>앱별 진행률</h2><span class="hint">Total → Revenue</span></div>
  <div id="apps"></div>

  <p class="empty" id="empty" style="display:none;">아직 기록된 진행 상황이 없습니다.</p>
  <footer id="foot">차실장 · ReleasePilot 출시 현황판</footer>
</div>

<script>
const PHASE_CLASS = { build: 'seg-build', launch: 'seg-launch', revenue: 'seg-revenue' };
const PHASE_COLOR = { build: '#c9711f', launch: '#4f7cac', revenue: '#2f7a63' };
const PHASE_LABEL = { build: '출시 전', launch: '제출·심사', revenue: '수익화' };

// 고정 데이터 — tool/launch_progress_cli.dart의 _stages, docs/23의 11단계와
// id가 정확히 일치해야 한다. 매번 API로 새로 글을 쓰는 게 아니라, 이 표 하나를
// 계속 재사용한다(2026-08-07 사용자 요청: "정해둘 부분은 재활용할 수 있게").
// 새 단계가 생기면 여기 한 줄만 추가하면 됨 — 렌더링 로직은 안 바뀜.
const STAGE_EXPLAIN = {
  registered:  { glyph: '📋', persuade: '시작 지점을 남겨야 나중에 얼마나 왔는지 잴 수 있다.' },
  analyzed:    { glyph: '🔎', persuade: '실제 코드를 안 보고 세운 계획은 추측일 뿐이다.' },
  strategy:    { glyph: '🎯', persuade: '정확히 누가 왜 사는지를 모르면, 그 뒤 모든 단계가 헛수고가 된다 — 가중치가 가장 큰 이유.' },
  mvp_locked:  { glyph: '🔒', persuade: '다 만들 필요 없다. 팔릴 핵심 하나만 먼저 잠가야 한다.' },
  metadata:    { glyph: '📝', persuade: '좋은 앱도 설명이 없으면 아무도 못 찾는다.' },
  build_signed:{ glyph: '🛠️', persuade: '코드가 실행 파일이 되는 마지막 기술적 관문.' },
  submitted:   { glyph: '📤', persuade: '이제 심사관이 본다 — 규정 위반 하나가 곧 반려다.' },
  approved:    { glyph: '🚀', persuade: '여기서부터 진짜 사용자가 만난다 — 두 번째로 가중치가 큰 이유.' },
  feedback_1:  { glyph: '💬', persuade: '출시는 끝이 아니라 진짜 데이터가 들어오는 시작점이다.' },
  marketing:   { glyph: '📣', persuade: '좋은 앱도 알려지지 않으면 존재하지 않는 것과 같다.' },
  revenue_1:   { glyph: '💰', persuade: '이게 증명이다 — 나머지 전부는 여기 도달하기 위한 과정이었다.' },
};

// 배포 가능성 — 지어내지 않고 항상 같은 문구(정직 원칙, 2026-08-10 추가).
// distribution이 비어있으면(platforms 미설정) "아직 어느 플랫폼을 목표하는지도
// 안 정해짐"으로 솔직히 표시한다 — 조용히 생략하지 않는다.
const DIST_STATUS_LABEL = {
  not_built: '아직 배포 전',
  unsigned_warning: '경고 뜨는 채 배포 가능',
  store_track: '스토어 트랙',
};
const PLATFORM_LABEL = { mac: '🍎 macOS', windows: '🪟 Windows', ios: '📱 iOS', android: '🤖 Android' };

function renderDistribution(a) {
  if (!a.platforms || !a.platforms.length) {
    return `<div class="next" style="margin-top:10px"><b>배포 가능성</b>아직 어느 플랫폼을 목표하는지 기록되지 않았습니다.</div>`;
  }
  const rows = a.distribution.map(d => `
    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px">
      <span style="font-weight:700">${PLATFORM_LABEL[d.platform] || d.platform}</span>
      <span class="chip ${d.status === 'not_built' ? '' : 'warn'}" style="margin-left:6px">${DIST_STATUS_LABEL[d.status] || d.status}</span>
      <p style="margin:6px 0 0;color:var(--ink-dim);line-height:1.55">${d.readiness}</p>
      ${d.policyNote ? `<p style="margin:4px 0 0;color:var(--ink-faint);font-size:11px;line-height:1.55">${d.policyNote}</p>` : ''}
    </div>`).join('');
  return `<div class="next" style="margin-top:10px"><b>🤖 배포 가능성 — 차실장 정직 리포트</b>${rows}</div>`;
}

function buildStageGuide(stages, apps) {
  const el = document.getElementById('stageGuide');
  const maxDone = apps.length ? Math.max(...apps.map(a => a.stagesDone)) : 0;
  stages.forEach((s, i) => {
    const info = STAGE_EXPLAIN[s.id] || { glyph: '•', persuade: '' };
    const reached = i < maxDone;
    const item = document.createElement('div');
    item.className = 'stage-item ' + (reached ? 'is-reached' : 'is-future');
    item.innerHTML = `
      <div class="stage-rail">
        <div class="stage-num" style="background:${PHASE_COLOR[s.phase]}">${info.glyph}</div>
        ${i < stages.length - 1 ? '<div class="stage-line"></div>' : ''}
      </div>
      <div class="stage-body">
        <div class="stage-top-row">
          <span class="stage-name">${i + 1}. ${s.label}</span>
          <span class="stage-phase-tag" style="background:${PHASE_COLOR[s.phase]}22;color:${PHASE_COLOR[s.phase]}">${PHASE_LABEL[s.phase]}</span>
          ${reached ? '<span class="stage-reached-badge">누군가 도달함</span>' : ''}
          <span class="stage-weight">비중 ${s.weight}</span>
        </div>
        <p class="stage-persuade">${info.persuade}</p>
      </div>`;
    el.appendChild(item);
  });
}

fetch('data.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
  if (!d || !d.apps || !d.apps.length) { document.getElementById('empty').style.display = 'block'; return; }

  const stages = d.stages;
  const totalW = stages.reduce((s, x) => s + x.weight, 0);
  const apps = d.apps;

  // ── 차실장 브리핑 — 데이터에서 직접 뽑은 사실만 말한다 ──────────
  const notClear = apps.filter(a => a.commercialClear === false);
  const blocked = apps.filter(a => a.blocked);
  const nearest = apps.slice().sort((a, b) => b.percentTotal - a.percentTotal)[0];
  const avg = Math.round(apps.reduce((s, a) => s + a.percentTotal, 0) / apps.length);

  let html = '<h2>🤖 차실장 브리핑</h2>';
  html += `<p>등록된 앱 <b>${apps.length}개</b>의 평균 진행률은 <b>${avg}%</b>입니다. `
        + `가장 앞선 건 <b>${nearest.name}</b>(${nearest.percentTotal}%, ${nearest.stageLabel})이고, `
        + `수익화까지 <b>${nearest.remainingStages.length}단계</b> 남았습니다.</p>`;
  if (notClear.length) {
    html += `<p>⚠ <b>${notClear.map(a => a.name).join(', ')}</b> — 누가 왜 사는지가 리포트에 분명하지 않습니다. `
          + `이 상태로 빌드를 더 진행해도 팔리지 않습니다. 타겟·수요 검증부터 다시 하거나, 접으십시오.</p>`;
  }
  if (blocked.length) {
    html += `<p>⛔ 막힌 항목: ${blocked.map(a => `<b>${a.name}</b>(${a.blocked})`).join(', ')}</p>`;
  }
  html += `<p style="font-size:11.5px;color:var(--ink-faint)">기준 시각 ${(d.generatedAt||'').slice(0,16).replace('T',' ')} · `
        + `진행률은 단계별 가중치 합으로 계산(총 ${totalW}점).</p>`;
  document.getElementById('briefing').innerHTML = html;

  buildStageGuide(stages, apps);

  // ── 앱별 막대 ────────────────────────────────────────────────
  function buildAppCard(a) {
    // 구간별로 색을 나눠 하나의 막대에 쌓는다 — 출시 전/출시/수익화가
    // 각각 얼마나 남았는지 색으로 바로 보이게.
    let segs = '';
    stages.forEach((s, i) => {
      if (i >= a.stagesDone) return;
      segs += `<span class="${PHASE_CLASS[s.phase]}" style="width:${(s.weight/totalW*100).toFixed(2)}%"></span>`;
    });

    const chips = [];
    chips.push(`<span class="chip">출시 준비 ${a.percentToLaunch}%</span>`);
    if (a.etaText) chips.push(`<span class="chip">예상 ${a.etaText}</span>`);
    if (a.version) chips.push(`<span class="chip">v${a.version}</span>`);
    if (a.commercialClear === true) chips.push('<span class="chip good">상업성 근거 있음</span>');
    if (a.commercialClear === false) chips.push('<span class="chip warn">상업성 근거 없음</span>');
    if (a.blocked) chips.push(`<span class="chip warn">막힘: ${a.blocked}</span>`);

    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML = `
      <div class="app-top">
        <span class="app-name">${a.name}</span>
        <span class="app-pct">${a.percentTotal}%</span>
      </div>
      <div class="app-stage">현재 단계 — ${a.stageLabel} (${a.stagesDone}/${a.stagesTotal})</div>
      <div class="bar">${segs}</div>
      <div class="meta-row">${chips.join('')}</div>
      ${a.waypoint ? `<div class="next"><b>다음에 할 일</b>${a.waypoint}</div>` : ''}
      <div class="remaining">남은 단계: ${a.remainingStages.join(' → ')}</div>
      ${renderDistribution(a)}`;
    return el;
  }

  // 30일 이상 손대지 않은 앱은 접어둔다(2026-08-10, "30일 동안 건들지 않은
  // 앱이 있으면 적당히 숨겨줘" 요청) — 지우진 않고 펼치면 그대로 다 보인다.
  // lastActiveAt이 아예 없으면(아주 옛날 데이터) 활동 없음으로 간주해 숨김
  // 쪽으로 보낸다 — 조용히 최신 취급해서 놓치는 것보다 안전한 기본값.
  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const activeApps = [];
  const staleApps = [];
  apps.forEach(a => {
    const t = a.lastActiveAt ? Date.parse(a.lastActiveAt) : NaN;
    if (!isNaN(t) && (now - t) <= THIRTY_DAYS_MS) activeApps.push(a);
    else staleApps.push(a);
  });

  const wrap = document.getElementById('apps');
  activeApps.forEach(a => wrap.appendChild(buildAppCard(a)));

  if (staleApps.length) {
    const details = document.createElement('details');
    details.className = 'stale-toggle';
    const summary = document.createElement('summary');
    summary.textContent = `30일 이상 손대지 않은 앱 ${staleApps.length}개 — 펼쳐서 보기`;
    details.appendChild(summary);
    staleApps.forEach(a => details.appendChild(buildAppCard(a)));
    wrap.appendChild(details);
  }

  const l = document.createElement('div');
  l.className = 'legend';
