<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교재 — 검색엔진은 어떻게 페이지를 찾고 순위를 매기나 (스킬트리)</title>
<meta name="description" content="예나 교재 · 크롤링·색인·순위 결정 요인을 스킬트리 방식으로 설명.">
<link rel="canonical" href="https://delight0517.github.io/releasepilot-reports/guides/seo-basics/">
<link rel="icon" href="../../icons/icon-192.png">
<meta name="theme-color" content="#0f1216">
<style>
  :root {
    --bg: #0f1216; --card: #171b21; --line: #262c34;
    --ink: #eef1f5; --ink-dim: #a9b2bd; --ink-faint: #626b76;
    --gold: #e6b23d; --gold-soft: rgba(230,178,61,0.14);
    --merge: #7fb0e0; --merge-soft: rgba(127,176,224,0.14);
    --done: #38c48f; --done-soft: rgba(56,196,143,0.14);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    --serif: "Iowan Old Style", Georgia, "Noto Serif KR", serif;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --card: #ffffff; --line: #e1e4e9;
    --ink: #14171b; --ink-dim: #4c545c; --ink-faint: #8a919a;
    --gold: #a3730f; --gold-soft: rgba(163,115,15,0.10);
    --merge: #2a5f8f; --merge-soft: rgba(42,95,143,0.08);
    --done: #1f8f66; --done-soft: rgba(31,143,102,0.08);
  }
  * { box-sizing: border-box; overflow-wrap: break-word; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 44px 20px 90px; }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0 0 6px; }
  .sub { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 30px; font-family: var(--mono); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .col-head { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .cell { min-height: 10px; }
  .node .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 13px; cursor: pointer; transition: border-color .15s ease, transform .15s ease; }
  .node .card:hover { transform: translateY(-2px); }
  .node.root .card { border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--card) 70%); }
  .node.merge .card { border-color: var(--merge); background: linear-gradient(180deg, var(--merge-soft), var(--card) 70%); }
  .node.selected .card { box-shadow: 0 0 0 2px var(--gold-soft); }
  .node .label { font-size: 12.5px; font-weight: 600; margin: 0; }
  .node .deps { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); margin-top: 6px; }

  .detail { margin-top: 34px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .detail h2 { font-family: var(--serif); font-weight: 400; font-size: 18px; margin: 0 0 10px; }
  .detail p, .detail li { font-size: 13.5px; color: var(--ink-dim); }
  .detail code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-family: var(--mono); font-size: 12.5px; color: var(--ink); }

  footer { margin-top: 40px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-align: center; }
  @media (max-width: 700px) { .grid { grid-template-columns: repeat(4, 220px); } }
</style>

<div class="wrap">
  <p class="kicker">예나 교재 · Skill Tree · 다이아몬드 구조</p>
  <h1>검색엔진은 어떻게 페이지를 찾고 순위를 매기나</h1>
  <p class="sub">GUIDE_SOP.md Column/Lane/Deps 문법 · 갈래가 나뉘었다가 다시 합쳐지는 구조</p>

  <div class="grid" id="gridMount"></div>
  <div class="detail" id="detailMount"></div>

  <footer>data source: 이 페이지에 내장된 노드 정의 · 관련: <a href="../google-search-console/" style="color:var(--merge);">Search Console 등록 교재</a></footer>
</div>

<script>
  const NODES = [
    { id: "crawlable", col: 0, lane: 1, label: "크롤링 가능 여부", deps: [],
      detail: `<h2>0 · 크롤링 가능 여부 (뿌리)</h2><p>robots.txt가 막고 있지 않은지, sitemap.xml이 있는지. 이게 안 되면 그 뒤 어떤 것도 시작이 안 됨.</p>` },
    { id: "indexed", col: 1, lane: 1, label: "색인(Index) 여부", deps: ["crawlable"],
      detail: `<h2>1 · 색인 여부</h2><p>크롤링됐다고 다 저장되는 게 아님 — 구글이 "저장할 가치 있다"고 판단해야 색인됨. Search Console의 "색인 생성 요청"은 이 판단을 더 빨리 받게 해달라는 요청일 뿐, 통과를 보장하지 않음.</p>` },
    { id: "relevance", col: 2, lane: 0, label: "콘텐츠 관련성", deps: ["indexed"],
      detail: `<h2>2a · 콘텐츠 관련성</h2><p>title/meta description, 본문에 실제 검색어가 자연스럽게 들어있는지. "김근후"처럼 고유한 이름은 경쟁이 거의 없어서 이 항목만으로도 꽤 잘 뜸.</p>` },
    { id: "trust", col: 2, lane: 1, label: "신뢰도 신호", deps: ["indexed"],
      detail: `<h2>2b · 신뢰도 신호</h2><p>다른 사이트가 이 페이지를 링크하는지(백링크), 도메인이 얼마나 오래됐는지. 지금은 이 신호가 거의 없는 신생 사이트 — 일반 키워드 단독 검색에서 상위 노출이 어려운 주된 이유.</p>` },
    { id: "ux", col: 2, lane: 2, label: "사용자 경험", deps: ["indexed"],
      detail: `<h2>2c · 사용자 경험</h2><p>로딩 속도, 모바일 친화성, HTTPS 여부. GitHub Pages는 기본적으로 HTTPS이고 정적 사이트라 속도는 이미 유리함.</p>` },
    { id: "freshness", col: 2, lane: 3, label: "신선도", deps: ["indexed"],
      detail: `<h2>2d · 신선도</h2><p>얼마나 자주 업데이트되는지, sitemap의 lastmod가 실제로 갱신되는지. 오늘처럼 계속 사이트를 추가/수정하는 게 이 신호에 도움이 됨.</p>` },
    { id: "ranking", col: 3, lane: 1, label: "최종 순위 결정", deps: ["relevance", "trust", "ux", "freshness"],
      detail: `<h2>3 · 최종 순위 (합류)</h2><p>2a~2d 네 가지가 합쳐져서 순위가 정해짐. 지금 상태 요약: 관련성·사용자경험·신선도는 유리, 신뢰도(백링크)는 아직 없음 — 그래서 "이름+키워드" 검색은 곧 잘 뜨지만, 일반 키워드 단독 1페이지는 아직 시기상조.</p>` },
  ];

  function render() {
    const mount = document.getElementById("gridMount");
    mount.innerHTML = "";
    for (let c = 0; c < 4; c++) {
      const head = document.createElement("div");
      head.className = "col-head";
      head.textContent = "COL " + c;
      head.style.gridColumn = (c + 1);
      head.style.gridRow = 1;
      mount.appendChild(head);
    }
    NODES.forEach(n => {
      const el = document.createElement("div");
      el.className = "node" + (n.deps.length === 0 ? " root" : "") + (n.deps.length > 1 ? " merge" : "");
      el.style.gridColumn = (n.col + 1);
      el.style.gridRow = (n.lane + 2);
      el.dataset.id = n.id;
      el.innerHTML = `<div class="card">
        <p class="label">${n.label}</p>
        ${n.deps.length ? `<p class="deps">← ${n.deps.join(", ")}</p>` : `<p class="deps">뿌리</p>`}
      </div>`;
      el.onclick = () => selectNode(n.id);
      mount.appendChild(el);
    });
  }

  function selectNode(id) {
    document.querySelectorAll(".node").forEach(el => el.classList.toggle("selected", el.dataset.id === id));
    const n = NODES.find(x => x.id === id);
    document.getElementById("detailMount").innerHTML = n.detail;
  }

  render();
  selectNode(NODES[0].id);
</script>
