<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김근후 · 근성장 — 링크</title>
<meta name="description" content="김근후의 모든 트랙으로 가는 링크 — 자체 호스팅 링크 허브.">
<link rel="icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#0a0a0f">
<style>
  :root {
    --bg: #0a0a0f; --card: #15141c; --line: #26242f;
    --ink: #f5f4f9; --ink-dim: #b7b4c4; --ink-faint: #726f80;
    --hot: #ff3d68; --hot-soft: rgba(255,61,104,0.16);
    --cyan: #34e0d8;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f3f1f6; --card: #ffffff; --line: #e2dfe8;
    --ink: #16141c; --ink-dim: #4c4959; --ink-faint: #8a8695;
    --hot: #e21c53; --hot-soft: rgba(226,28,83,0.10);
  }
  * { box-sizing: border-box; overflow-wrap: break-word; }
  body { margin: 0; min-height: 100vh;
    background: radial-gradient(900px 480px at 15% -10%, var(--hot-soft), transparent 60%), var(--bg);
    color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 18px 64px; }

  .masthead { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .avatar { width: 62px; height: 62px; border-radius: 18px; flex: none;
    background: linear-gradient(135deg, var(--hot), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 24px; font-weight: 700; color: #0a0a0f; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0; }
  .handle { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-faint); margin: 3px 0 0; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
    background: var(--card); aspect-ratio: 1 / 1; transition: transform .15s ease, border-color .15s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--hot); }
  .tile.big { grid-column: span 2; aspect-ratio: 21 / 9; }
  .tile.pinned { border-color: var(--hot); }

  .tile .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .tile .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,15,0) 30%, rgba(10,10,15,0.88) 100%); }
  .tile.no-photo .scrim { background: none; }
  .tile.no-photo { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .tile.no-photo .emoji { font-size: 26px; }

  .tile .content { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; }
  .tile .emoji-badge { position: absolute; top: 10px; left: 10px; font-size: 15px;
    background: rgba(10,10,15,0.55); border-radius: 8px; padding: 4px 7px; backdrop-filter: blur(4px); }
  .tile .pin-badge { position: absolute; top: 10px; right: 10px; color: var(--hot); font-size: 13px; }
  .tile .label { font-family: var(--serif); font-size: 16px; color: #fff; margin: 0; line-height: 1.25; }
  .tile.no-photo .label { color: var(--ink); font-size: 14px; }
  .tile .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; color: rgba(255,255,255,0.72); margin: 3px 0 0; }
  .tile.no-photo .sub { color: var(--ink-faint); }
  .tile.no-photo .label, .tile.no-photo .sub { position: static; }
  .tile.no-photo .content { position: static; padding: 0; }

  footer { margin-top: 40px; text-align: center; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  .empty { grid-column: 1 / -1; font-size: 13px; color: var(--ink-faint); padding: 20px 0; text-align: center; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 9px; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <div class="avatar">근</div>
    <div>
      <h1>김근후 · 근성장</h1>
      <p class="handle">자체 호스팅 링크 허브 · rogankimwashere</p>
    </div>
  </div>

  <div class="grid" id="listMount">
    <p class="empty">불러오는 중...</p>
  </div>

  <footer>이 페이지는 links.json 하나로 움직입니다 · 새 링크는 파일에 한 줄만 추가</footer>
</div>

<script>
  fetch("./links.json")
    .then(r => r.json())
    .then(items => {
      const mount = document.getElementById("listMount");
      mount.innerHTML = "";
      (Array.isArray(items) ? items : []).forEach(it => {
        const a = document.createElement("a");
        const hasPhoto = !!it.image;
        a.className = "tile" + (it.big ? " big" : "") + (it.pinned ? " pinned" : "") + (hasPhoto ? "" : " no-photo");
        a.href = it.url;
        a.target = it.url.startsWith("http") ? "_blank" : "_self";
        a.rel = "noopener";
        if (hasPhoto) {
          a.innerHTML = `
            <div class="photo" style="background-image:url('${it.image}')"></div>
            <div class="scrim"></div>
            <span class="emoji-badge">${it.emoji || "•"}</span>
            ${it.pinned ? '<span class="pin-badge">✦</span>' : ""}
            <div class="content">
              <p class="label">${it.label}</p>
              ${it.sub ? `<p class="sub">${it.sub}</p>` : ""}
            </div>`;
        } else {
          a.innerHTML = `
            ${it.pinned ? '<span class="pin-badge">✦</span>' : ""}
            <span class="emoji">${it.emoji || "•"}</span>
            <div class="content">
              <p class="label">${it.label}</p>
              ${it.sub ? `<p class="sub">${it.sub}</p>` : ""}
            </div>`;
        }
        mount.appendChild(a);
      });
      if (!items.length) mount.innerHTML = '<p class="empty">등록된 링크가 없습니다.</p>';
    })
    .catch(e => {
      document.getElementById("listMount").innerHTML = '<p class="empty">links.json을 불러오지 못했습니다.</p>';
      console.error(e);
    });
</script>
