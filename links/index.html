<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김근후 · 근성장 — 좌표</title>
<meta name="description" content="김근후의 모든 트랙으로 가는 좌표 — 자체 호스팅 링크 허브.">
<link rel="icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#f4efe0">
<style>
  :root {
    --paper: #f4efe0; --paper-2: #ece3cc; --ink: #2b2415; --ink-dim: #5a4e34; --ink-faint: #8a7c56;
    --seal: #9c3b2c; --seal-soft: rgba(156,59,44,0.09); --seal-ink: #7a2e22; --line: #d8cba3;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1c1710; --paper-2: #241d13; --ink: #ece2c8; --ink-dim: #bcae8c; --ink-faint: #7d715a; --seal: #d1725c; --seal-soft: rgba(209,114,92,0.12); --seal-ink: #e39684; --line: #3a3020; }
  }
  :root[data-theme="dark"] { --paper: #1c1710; --paper-2: #241d13; --ink: #ece2c8; --ink-dim: #bcae8c; --ink-faint: #7d715a; --seal: #d1725c; --seal-soft: rgba(209,114,92,0.12); --seal-ink: #e39684; --line: #3a3020; }
  :root[data-theme="light"] { --paper: #f4efe0; --paper-2: #ece3cc; --ink: #2b2415; --ink-dim: #5a4e34; --ink-faint: #8a7c56; --seal: #9c3b2c; --seal-soft: rgba(156,59,44,0.09); --seal-ink: #7a2e22; --line: #d8cba3; }
  * { box-sizing: border-box; overflow-wrap: break-word; }
  body { margin: 0; min-height: 100vh; background:
      radial-gradient(900px 500px at 50% -14%, var(--seal-soft), transparent 60%),
      var(--paper);
    color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 60px 20px 60px; }

  .masthead { text-align: center; margin-bottom: 8px; }
  .lat { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--seal-ink); margin: 0 0 16px; }
  .compass { width: 46px; height: 46px; margin: 0 auto 18px; border: 1.5px solid var(--seal); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-family: var(--serif); color: var(--seal); font-size: 20px; position: relative; }
  .compass::before, .compass::after { content: ""; position: absolute; background: var(--seal); opacity: 0.5; }
  .compass::before { width: 1px; height: 60px; left: 50%; top: -60px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 27px; margin: 0 0 4px; text-align: center; }
  .handle { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint); text-transform: uppercase; text-align: center; margin: 0 0 44px; }

  .ledger { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
    padding: 15px 4px; border-bottom: 1px solid var(--line); transition: background .15s ease; }
  .row:hover { background: var(--seal-soft); }
  .row .coord { font-family: var(--mono); font-size: 10.5px; color: var(--seal-ink); letter-spacing: 0.02em; }
  .row .label { font-family: var(--serif); font-size: 16.5px; color: var(--ink); }
  .row .go { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .row.pinned .label { color: var(--seal-ink); }
  .row.pinned .coord { color: var(--seal); font-weight: 700; }
  .row.pinned .label::after { content: " ✦"; font-size: 11px; color: var(--seal); }

  footer { margin-top: 40px; text-align: center; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  .empty { font-size: 13px; color: var(--ink-faint); padding: 20px 0; text-align: center; }
</style>

<div class="wrap">
  <div class="masthead">
    <p class="lat">37.5665°N, 126.9780°E · SEOUL</p>
    <div class="compass">✦</div>
    <h1>김근후의 좌표</h1>
    <p class="handle">근성장 — 마음의 지도 제작자 · 자체 호스팅 링크 허브</p>
  </div>

  <div class="ledger" id="listMount">
    <p class="empty">불러오는 중...</p>
  </div>

  <footer>이 페이지는 links.json 하나로 움직입니다 · 새 좌표는 파일에 한 줄만 추가</footer>
</div>

<script>
  fetch("./links.json")
    .then(r => r.json())
    .then(items => {
      const mount = document.getElementById("listMount");
      mount.innerHTML = "";
      (Array.isArray(items) ? items : []).forEach((it, i) => {
        const a = document.createElement("a");
        a.className = "row" + (it.pinned ? " pinned" : "");
        a.href = it.url;
        a.target = it.url.startsWith("http") ? "_blank" : "_self";
        a.rel = "noopener";
        const num = String(i + 1).padStart(2, "0");
        a.innerHTML = `<span class="coord">N-${num}</span><span class="label">${it.label}</span><span class="go">→</span>`;
        mount.appendChild(a);
      });
      if (!items.length) mount.innerHTML = '<p class="empty">등록된 좌표가 없습니다.</p>';
    })
    .catch(e => {
      document.getElementById("listMount").innerHTML = '<p class="empty">links.json을 불러오지 못했습니다.</p>';
      console.error(e);
    });
</script>
