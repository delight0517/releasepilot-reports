<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김근후 · 근성장 — 링크</title>
<meta name="description" content="김근후의 모든 트랙으로 가는 링크 — 자체 호스팅 링크 허브.">
<link rel="icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#171226">
<style>
  :root {
    --bg: #171226; --bg-2: #1e1830; --card: #221b38; --line: #3a3157;
    --ink: #f1ecdf; --ink-dim: #c8bfe0; --ink-faint: #8b81ab;
    --seal: #e8a33d; --seal-soft: rgba(232,163,61,0.14);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f4efe4; --bg-2: #ece4d2; --card: #fffcf5; --line: #ddd0af;
    --ink: #241d10; --ink-dim: #5c5031; --ink-faint: #8c7f5c;
    --seal: #b9781e; --seal-soft: rgba(185,120,30,0.10);
  }
  * { box-sizing: border-box; overflow-wrap: break-word; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(600px 380px at 50% -10%, var(--seal-soft), transparent 60%), var(--bg);
    color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 64px 20px 60px; text-align: center; }
  .photo { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 18px; border: 3px solid var(--seal);
    box-shadow: 0 0 0 6px var(--seal-soft); background: var(--card); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 30px; color: var(--seal); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0 0 6px; }
  .handle { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; margin: 0 0 28px; }

  .list { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 15px 18px; transition: border-color .15s ease, transform .15s ease; }
  .item:hover { border-color: var(--seal); transform: translateY(-1px); }
  .item .emoji { font-size: 18px; flex: none; width: 22px; text-align: center; }
  .item .label { font-size: 14.5px; color: var(--ink); flex: 1; }
  .item.pinned { border-color: var(--seal); background: linear-gradient(180deg, var(--seal-soft), var(--card) 60%); }
  .item .arrow { color: var(--ink-faint); font-family: var(--mono); font-size: 13px; }

  footer { margin-top: 40px; font-size: 11.5px; color: var(--ink-faint); }
  .empty { font-size: 13px; color: var(--ink-faint); padding: 20px 0; }
</style>

<div class="wrap">
  <div class="photo">근</div>
  <h1>김근후 · 근성장</h1>
  <p class="handle">자체 호스팅 링크 허브 · rogankimwashere</p>

  <div class="list" id="listMount">
    <p class="empty">불러오는 중...</p>
  </div>

  <footer>이 페이지는 <code>links.json</code> 하나로 움직입니다 — 새 링크는 파일에 한 줄만 추가하면 바로 반영됩니다.</footer>
</div>

<script>
  // 이 파일 하나가 이 페이지의 유일한 데이터 소스다. 새 사이트를 만들거나
  // 순서를 바꾸고 싶으면 links.json만 고치면 되고, 이 index.html은
  // 다시 건드릴 필요가 없다 — "자율자재로 더할 수 있게" 만든 이유.
  fetch("./links.json")
    .then(r => r.json())
    .then(items => {
      const mount = document.getElementById("listMount");
      mount.innerHTML = "";
      (Array.isArray(items) ? items : []).forEach(it => {
        const a = document.createElement("a");
        a.className = "item" + (it.pinned ? " pinned" : "");
        a.href = it.url;
        a.target = it.url.startsWith("http") ? "_blank" : "_self";
        a.rel = "noopener";
        a.innerHTML = `<span class="emoji">${it.emoji || "•"}</span><span class="label">${it.label}</span><span class="arrow">→</span>`;
        mount.appendChild(a);
      });
      if (!items.length) mount.innerHTML = '<p class="empty">링크가 아직 없습니다.</p>';
    })
    .catch(e => {
      document.getElementById("listMount").innerHTML = '<p class="empty">links.json을 불러오지 못했습니다.</p>';
      console.error(e);
    });
</script>
