<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자료실</title>
<meta name="description" content="노션처럼 폴더 안에 폴더를 넣어 자료를 정리하는 자료실 — 유저명+PIN으로 어디서든 접근 가능" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="screen-login">
    <div class="login-card">
      <h1>🗂️ 자료실</h1>
      <p class="hint">유저명 + 4자리 PIN만으로 이용합니다. 처음 쓰는 유저명이면 그 자리에서 새 계정이 만들어지고, 다음에 올 때 같은 유저명+PIN을 입력하면 이어서 볼 수 있습니다.</p>
      <label for="login-username-input">유저명</label>
      <input id="login-username-input" type="text" placeholder="한/영/숫자, 2~24자" maxlength="24" autocomplete="username" />
      <label for="login-pin-input">PIN (숫자 4자리)</label>
      <input id="login-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="current-password" />
      <button id="btn-login" class="primary-btn full-width">시작하기</button>
      <p id="login-status" class="hint error"></p>
      <p class="hint faint">⚠️ 임시 자료실입니다 — PIN 4자리라 보안이 강하지 않습니다. 민감한 정보는 저장하지 마세요. PIN을 잊으면 그 유저명은 되찾을 방법이 없습니다.</p>
    </div>
  </section>

  <section id="screen-app" style="display:none">
    <header>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="header-actions">
        <span id="account-badge" class="account-badge"></span>
        <button id="btn-import" class="icon-btn" title="가져오기">📥</button>
        <button id="btn-export" class="icon-btn" title="내보내기">📤</button>
        <button id="btn-backups" class="icon-btn" title="하루 단위 백업에서 복구">🕐</button>
        <button id="btn-logout" class="icon-btn" title="로그아웃">🚪</button>
      </div>
      <input id="import-file-input" type="file" accept="application/json" style="display:none" />
    </header>

    <p id="sync-status" class="hint sync-status"></p>

    <main>
      <div id="browser-list" class="browser-list"></div>
    </main>

    <div class="fab-row">
      <button id="btn-add-folder" class="fab secondary">📁＋</button>
      <button id="btn-add-document" class="fab primary" style="display:none">📄＋</button>
    </div>
  </section>

  <!-- 읽기 화면 — 기본 진입점. 편집 화면과 분리해서 폰트 크게/전체화면으로 편하게 읽게 한다. -->
  <div id="screen-read" class="fullscreen-modal" style="display:none">
    <div class="read-header">
      <button id="btn-read-close" class="icon-btn" title="닫기">✕</button>
      <div class="font-size-controls">
        <button id="btn-font-smaller" class="icon-btn" title="글자 작게">A-</button>
        <button id="btn-font-bigger" class="icon-btn" title="글자 크게">A+</button>
      </div>
      <button id="btn-read-edit" class="secondary-btn">✏️ 편집</button>
    </div>
    <div class="read-body">
      <h2 id="read-title"></h2>
      <div id="read-content" class="read-content"></div>
    </div>
  </div>

  <div id="modal-backups" class="modal" style="display:none">
    <div class="modal-card">
      <h2>하루 단위 백업</h2>
      <p class="hint">매일 그날의 첫 저장 직전 상태가 자동으로 남습니다. 실수로 지웠다면 여기서 되돌릴 날짜를 고르세요.</p>
      <div id="backups-list" class="backups-list"></div>
      <div class="modal-actions">
        <button id="btn-backups-close" class="secondary-btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="modal-editor" class="modal" style="display:none">
    <div class="modal-card">
      <h2 id="editor-heading">새 자료</h2>
      <input id="editor-title-input" type="text" placeholder="제목" />
      <textarea id="editor-content-input" placeholder="내용"></textarea>
      <div class="modal-actions">
        <button id="btn-editor-cancel" class="secondary-btn">취소</button>
        <button id="btn-editor-save" class="primary-btn">저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
