<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자료실</title>
<meta name="description" content="노션처럼 폴더 안에 폴더를 넣어 자료를 정리하는 자료실 — 닉네임만으로 바로 시작" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 최초 방문 시에만 뜨는 닉네임 입력 화면. 이후 방문부터는 localStorage에 저장된
       닉네임으로 바로 건너뛴다(자동 로그인) — 비밀번호/PIN 없음. -->
  <section id="screen-nickname" style="display:none">
    <div class="login-card">
      <h1>🗂️ 자료실</h1>
      <p class="hint">이름(닉네임)을 입력하면 바로 시작됩니다 — 비밀번호는 없어요. 다음에 이 브라우저로 다시 오면 자동으로 이어서 볼 수 있습니다.</p>
      <label for="nickname-input">이름(닉네임)</label>
      <input id="nickname-input" type="text" placeholder="예: rogan2534" maxlength="24" autocomplete="off" />
      <button id="btn-nickname-start" class="primary-btn full-width">시작하기</button>
      <p id="nickname-status" class="hint error"></p>
      <p class="hint faint">⚠️ 이 이름은 잠금장치가 아니라 그냥 구분용 별명이에요. 자료는 이 브라우저에만 저장되며, 아래 "GitHub에 백업"으로 내보내야 다른 기기에서도 같은 이름으로 불러올 수 있습니다.</p>
    </div>
  </section>

  <section id="screen-app" style="display:none">
    <header>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="header-actions">
        <span id="account-badge" class="account-badge"></span>
        <button id="btn-import" class="icon-btn" title="가져오기">📥</button>
        <button id="btn-export" class="icon-btn" title="내보내기">📤</button>
        <button id="btn-github-backup" class="icon-btn" title="GitHub에 백업">💾</button>
      </div>
      <input id="import-file-input" type="file" accept="application/json" style="display:none" />
    </header>

    <p class="hint faint">👤 <span id="username-label"></span> · <button id="btn-change-nickname" class="linklike">다른 이름으로 시작</button><br>이 브라우저에만 저장됩니다 — 다른 기기/브라우저에서 이어보려면 "GitHub에 백업"을 사용하세요.</p>

    <p id="github-backup-hint" class="hint faint" style="display:none"></p>

    <div class="search-bar">
      <input id="search-input" type="text" placeholder="🔍 전체 검색 (폴더 위치 상관없이 제목/내용/폴더명)" autocomplete="off" />
    </div>

    <p id="sync-status" class="hint sync-status"></p>

    <main>
      <div id="search-results" class="browser-list" style="display:none"></div>
      <div id="browser-list" class="browser-list"></div>
    </main>

    <div class="fab-row">
      <button id="btn-add-folder" class="fab secondary">📁＋</button>
      <button id="btn-add-document" class="fab primary" style="display:none">📄＋</button>
    </div>
  </section>

  <!-- 읽기 화면 — 기본 진입점. 편집 화면과 분리해서 폰트 크게/전체화면으로 편하게 읽게 한다. -->
  <div id="screen-read" class="fullscreen-modal" style="display:none">
    <div class="read-header">
      <button id="btn-read-close" class="icon-btn" title="닫기">✕</button>
      <div class="font-size-controls">
        <button id="btn-font-smaller" class="icon-btn" title="글자 작게">A-</button>
        <button id="btn-font-bigger" class="icon-btn" title="글자 크게">A+</button>
      </div>
      <button id="btn-read-edit" class="secondary-btn">✏️ 편집</button>
    </div>
    <div class="read-body">
      <h2 id="read-title"></h2>
      <div id="read-content" class="read-content"></div>
    </div>
  </div>

  <div id="modal-editor" class="modal" style="display:none">
    <div class="modal-card">
      <h2 id="editor-heading">새 자료</h2>
      <input id="editor-title-input" type="text" placeholder="제목" />
      <textarea id="editor-content-input" placeholder="내용"></textarea>
      <div class="modal-actions">
        <button id="btn-editor-cancel" class="secondary-btn">취소</button>
        <button id="btn-editor-save" class="primary-btn">저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
