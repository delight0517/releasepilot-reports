<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>밸런스 게임 — 리포트</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📊 응답 리포트</h1>
    <a href="index.html" class="icon-btn" title="게임으로">🎮</a>
  </header>

  <main>
    <section id="screen-admin-settings">
      <label for="admin-collector-url">Worker URL</label>
      <input id="admin-collector-url" type="text" placeholder="https://balance-game-survey-collector.xxx.workers.dev" />
      <label for="admin-key">관리자 키 (wrangler secret put ADMIN_KEY 로 등록한 값)</label>
      <input id="admin-key" type="password" placeholder="ADMIN_KEY" />
      <label for="admin-mode">모드</label>
      <select id="admin-mode">
        <option value="">전체</option>
        <option value="art">🎨 아트 레퍼런스</option>
        <option value="career">🧭 커리어/콘텐츠 경로</option>
      </select>
      <div class="row">
        <button id="btn-fetch" class="primary-btn">불러오기</button>
        <button id="btn-download-md" class="secondary-btn">📥 리포트 다운로드 (.md)</button>
        <button id="btn-download-json" class="secondary-btn">📥 원본 다운로드 (.json)</button>
      </div>
      <p id="admin-status" class="hint"></p>
    </section>

    <section id="screen-admin-list">
      <div id="admin-list"></div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="admin.js"></script>
</body>
</html>
