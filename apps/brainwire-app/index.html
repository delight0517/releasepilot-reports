<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브레인와이어 — 학습 로드맵</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#58CC02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#FFFFFF;
    --color-bg-soft:#F7F9FA;
    --color-primary:#58CC02;
    --color-primary-dark:#4CAF00;
    --color-blue:#1CB0F6;
    --color-blue-dark:#1899D6;
    --color-gold:#FFC800;
    --color-gold-dark:#E5B400;
    --color-red:#FF4B4B;
    --color-red-dark:#E63E3E;
    --color-text:#3C3C3C;
    --color-text-soft:#767676;
    --color-border:#E5E5E5;
    --color-locked:#CFCFCF;
    --color-locked-dark:#B3B3B3;
    --font-display:'Baloo 2','Segoe UI Rounded','Segoe UI',sans-serif;
    --font-body:'Nunito','Segoe UI Rounded','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--color-bg-soft);color:var(--color-text);}
  button{font-family:inherit;}
  button:focus-visible, .node:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px solid var(--color-blue); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    padding:12px 24px;background:#fff;border-bottom:2px solid var(--color-border);
    position:sticky;top:0;z-index:20;
  }
  .logo{font-family:var(--font-display);font-weight:800;font-size:21px;color:var(--color-primary);display:flex;align-items:center;gap:8px;}
  .stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .stat-pill{display:flex;align-items:center;gap:5px;font-weight:800;font-family:var(--font-display);font-size:15px;}
  .stat-pill.streak{color:var(--color-red);}
  .stat-pill.gems{color:var(--color-blue);}
  .stat-pill.xp{color:var(--color-gold-dark);}
  .nav-tabs{display:flex;gap:8px;}
  .nav-tab{padding:9px 18px;border-radius:999px;font-weight:800;font-family:var(--font-display);font-size:13px;
    cursor:pointer;color:var(--color-text-soft);border:2px solid var(--color-border);background:#fff;}
  .nav-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}

  /* ---------- Buttons ---------- */
  .btn{font-family:var(--font-display);font-weight:800;letter-spacing:.3px;border:none;border-radius:14px;
    padding:13px 22px;cursor:pointer;font-size:13px;transition:transform .05s;text-transform:uppercase;}
  .btn-primary{background:var(--color-primary);color:#fff;box-shadow:0 4px 0 var(--color-primary-dark);}
  .btn-primary:active{transform:translateY(4px);box-shadow:none;}
  .btn-blue{background:var(--color-blue);color:#fff;box-shadow:0 4px 0 var(--color-blue-dark);}
  .btn-blue:active{transform:translateY(4px);box-shadow:none;}
  .btn-outline{background:#fff;color:var(--color-text-soft);border:2px solid var(--color-border);box-shadow:0 4px 0 var(--color-border);}
  .btn-outline:active{transform:translateY(4px);box-shadow:none;}
  .btn-danger{background:#fff;color:var(--color-red);border:2px solid #FFD6D6;box-shadow:none;padding:7px 12px;font-size:11px;border-radius:10px;text-transform:none;cursor:pointer;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-block{width:100%;}

  /* ---------- 투입 박스 ---------- */
  .ingest-wrap{max-width:560px;margin:0 auto;padding:18px 16px 0;}
  .ingest-card{background:#fff;border:2px solid var(--color-border);border-radius:16px;padding:18px 20px;}
  .ingest-title{font-family:var(--font-display);font-weight:800;font-size:16px;margin-bottom:6px;}
  .ingest-card textarea{width:100%;padding:11px 13px;border:2px solid var(--color-border);border-radius:11px;
    font-family:var(--font-body);font-size:14px;resize:vertical;line-height:1.5;}
  .ingest-card textarea:focus{outline:none;border-color:var(--color-blue);}

  .notice{max-width:560px;margin:14px auto 0;padding:11px 16px;border-radius:12px;background:#E8F7D4;
    color:#3F7A00;font-weight:700;font-size:13px;border:2px solid #CDEBA6;}
  .notice.pending{background:#FFF6D9;color:var(--color-gold-dark);border-color:#F5E3A8;}

  /* ---------- 오늘 복습할 것 ---------- */
  .due-section{max-width:560px;margin:18px auto 0;padding:0 16px;}
  .due-title{font-family:var(--font-display);font-weight:800;font-size:16px;margin-bottom:10px;}
  .due-list{display:flex;flex-direction:column;gap:8px;}
  .due-card{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--color-border);
    border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font-family:var(--font-body);width:100%;}
  .due-card:hover{border-color:var(--color-blue);}
  .due-card-title{flex:1;font-weight:800;font-size:14px;}
  .stage-chip{display:inline-block;background:var(--color-blue);color:#fff;font-family:var(--font-display);
    font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;flex-shrink:0;}

  /* ---------- Course chips ---------- */
  .course-chips{display:flex;gap:10px;padding:18px 24px 4px;overflow-x:auto;max-width:560px;margin:0 auto;}
  .course-chip{flex:0 0 auto;padding:9px 16px;border-radius:14px;font-weight:800;font-family:var(--font-display);
    font-size:13px;cursor:pointer;border:2px solid var(--color-border);background:#fff;color:var(--color-text-soft);white-space:nowrap;}

  /* ---------- Path ---------- */
  .path-wrap{max-width:440px;margin:0 auto;padding:12px 16px 90px;}
  .empty-state{text-align:center;padding:70px 20px;color:var(--color-text-soft);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}
  .unit-banner{border-radius:16px;padding:16px 20px;margin:26px 0 34px;box-shadow:0 4px 0 rgba(0,0,0,.15);color:#fff;
    background:var(--unit-color);}
  .unit-banner .unit-eyebrow{font-size:11px;opacity:.85;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  .unit-banner .unit-name{font-family:var(--font-display);font-size:19px;font-weight:800;margin-top:2px;}
  .node-row{display:flex;flex-direction:column;align-items:center;}
  .connector{width:6px;height:32px;border-radius:3px;background:var(--color-border);}
  .connector.done{background:var(--color-primary);}
  .connector.hide{visibility:hidden;}
  .node-shift{position:relative;padding-top:6px;}
  .node-label{position:absolute;top:-14px;left:50%;transform:translate(-50%,-100%);background:#fff;
    border:2px solid var(--color-border);border-radius:9px;padding:5px 12px;font-family:var(--font-display);
    font-weight:800;font-size:11px;white-space:nowrap;color:var(--color-primary);box-shadow:0 2px 0 var(--color-border);}
  .node-label:after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#fff;}
  .node{width:72px;height:72px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
    font-size:26px;cursor:pointer;background:var(--node-color);color:#fff;box-shadow:0 6px 0 var(--shadow-color);}
  .node:active:not(:disabled){transform:translateY(6px);box-shadow:none;}
  .node.waiting{background:var(--color-locked);box-shadow:0 6px 0 var(--color-locked-dark);color:#fff;}
  .node.mastered{box-shadow:0 6px 0 var(--shadow-color),0 0 0 5px #FFF0B8;}
  .node.due{animation:pulse 1.7s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 6px 0 var(--shadow-color),0 0 0 0 rgba(88,204,2,.35);}
    50%{box-shadow:0 6px 0 var(--shadow-color),0 0 0 12px rgba(88,204,2,0);}
  }
  .lesson-title-under{margin-top:8px;font-size:12px;color:var(--color-text-soft);text-align:center;max-width:150px;font-weight:700;}

  /* ---------- Admin ---------- */
  .admin-wrap{max-width:760px;margin:0 auto;padding:22px 20px 80px;}
  .section-title{font-family:var(--font-display);font-weight:800;font-size:17px;margin:26px 0 12px;color:var(--color-text);}
  .card{background:#fff;border:2px solid var(--color-border);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
  .list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border);}
  .list-row:last-child{border-bottom:none;}
  .muted{color:var(--color-text-soft);font-size:12.5px;}
  .empty-hint{color:var(--color-text-soft);font-size:13px;padding:8px 2px;}
  .footer-tools{text-align:center;margin-top:30px;}
  .edit-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .edit-name{padding:8px 11px;border:2px solid var(--color-border);border-radius:10px;
    font-family:var(--font-body);font-size:13.5px;font-weight:700;color:var(--color-text);flex:1;min-width:90px;}
  .edit-name:focus{outline:none;border-color:var(--color-blue);}
  input[type=color]{width:38px;height:34px;padding:2px;border:2px solid var(--color-border);border-radius:9px;
    background:#fff;cursor:pointer;flex-shrink:0;}
  .edit-unit{border-left:3px solid var(--color-border);padding-left:12px;margin:14px 0 0 4px;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(60,60,60,.55);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:30px 26px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--color-text-soft);}
  .modal h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
  .modal .modal-sub{color:var(--color-text-soft);font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .question-box{background:var(--color-bg-soft);border-radius:14px;padding:16px;margin-bottom:16px;font-weight:700;line-height:1.6;}
  .feedback-box{background:var(--color-bg-soft);border-radius:14px;padding:16px;line-height:1.6;font-size:14px;margin-bottom:16px;}
  .modal textarea{width:100%;padding:11px 13px;border:2px solid var(--color-border);border-radius:11px;
    font-family:var(--font-body);font-size:14px;line-height:1.5;resize:vertical;}
  .modal textarea:focus{outline:none;border-color:var(--color-blue);}
  .field{margin-bottom:13px;}
  .error-text{color:var(--color-red);font-weight:700;text-align:center;margin:16px 0;font-size:14px;}

  /* ---------- 적응형 UI: 접힘 서랍 + 사용량 패널 ---------- */
  .nav-tab.folded-toggle{border-style:dashed;color:var(--color-text-soft);}
  .nav-tab.mini{font-size:11px;padding:6px 12px;opacity:.75;}
  .folded-drawer{max-width:560px;margin:28px auto 0;padding:0 16px 60px;}
  .folded-head{width:100%;text-align:left;background:none;border:2px dashed var(--color-border);
    border-radius:12px;padding:10px 14px;cursor:pointer;font-family:var(--font-display);
    font-weight:800;font-size:12px;color:var(--color-text-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .folded-head .muted{font-weight:600;}

  .usage-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .usage-label{flex:0 0 190px;font-weight:700;font-size:12.5px;}
  .usage-bar-wrap{flex:1;height:12px;background:var(--color-bg-soft);border-radius:999px;overflow:hidden;}
  .usage-bar{height:100%;border-radius:999px;min-width:2px;}
  .usage-num{flex:0 0 90px;text-align:right;font-size:11.5px;color:var(--color-text-soft);font-weight:700;}
  @media (max-width:600px){
    .usage-label{flex-basis:120px;font-size:11.5px;}
    .usage-num{flex-basis:70px;}
  }

  @media (max-width:480px){
    .topbar{padding:10px 14px;}
    .logo{font-size:18px;}
    .stat-pill{font-size:13px;}
    .path-wrap{padding:6px 8px 90px;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🧠 브레인와이어</div>
    <div class="stats">
      <div class="stat-pill streak">🔥 <span id="stat-streak">0</span></div>
      <div class="stat-pill gems">💎 <span id="stat-gems">0</span></div>
      <div class="stat-pill xp">⚡ <span id="stat-xp">0</span></div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </header>

  <main id="main-content"></main>

  <div class="modal-overlay hidden" id="quiz-modal">
    <div class="modal" id="quiz-modal-body"></div>
  </div>

<script>window.BRAINWIRE_CLOUD_MODE = true;</script>
<script src="cloudStore.js"></script>
<script src="usage.js"></script>
<script src="app.js"></script>
</body>
</html>
