<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 허브 · ReleasePilot</title>
<style>
  :root {
    --bg: #12151c; --bg-soft: #191d27; --card: #1c212c; --line: #2c3242;
    --ink: #ece6d8; --ink-dim: #8b93a6; --ink-faint: #5c6478;
    --gold: #d9a24f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px 80px; }

  .hero { margin-bottom: 32px; }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 8px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif; font-weight: 400;
    font-size: clamp(26px, 6vw, 34px); margin: 0 0 10px; color: var(--ink);
  }
  .hero p { margin: 0; font-size: 13.5px; color: var(--ink-dim); max-width: 56ch; }

  /* app icon row — like a home screen */
  .apps {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 14px; margin: 28px 0 8px;
  }
  .app-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-decoration: none; color: inherit; cursor: pointer;
    background: none; border: none; padding: 0; font: inherit;
  }
  .app-icon {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .app-tile .name {
    font-size: 11px; text-align: center; color: var(--ink-dim);
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-tile .count {
    font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--ink-faint);
  }

  section.app-group {
    margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line);
    scroll-margin-top: 20px;
  }
  .app-group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .app-group-head .app-icon { width: 34px; height: 34px; font-size: 16px; border-radius: 10px; }
  .app-group-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
  .app-group-head .sub { font-size: 11.5px; color: var(--ink-faint); }

  .report-card {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    text-decoration: none; color: inherit;
    border-left-width: 3px; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .report-card:hover { background: var(--bg-soft); }
  .report-title { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .report-meta {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px;
    color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 8px;
  }
  .report-meta .kind {
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; text-transform: none;
  }

  .empty { font-size: 13px; color: var(--ink-faint); padding: 24px 0; }
  footer { margin-top: 48px; font-size: 11px; color: var(--ink-faint); text-align: center; }
</style>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Cross-project · GitHub Pages</p>
    <h1>리포트 허브</h1>
    <p>ReleasePilot의 "게시" 버튼으로 올린 사용법 기획서·전략 리포트·게임 기획서를 앱별로 모아봅니다.
       자동으로 올라가지 않습니다 — 직접 게시한 것만 여기 보입니다.</p>
  </div>

  <div class="apps" id="apps"></div>
  <div id="groups"></div>
  <p class="empty" id="empty" style="display:none;">아직 게시된 리포트가 없습니다.</p>
  <footer>ReleasePilot 리포트 허브 · 정적 페이지, 빌드 없음</footer>
</div>

<script>
// A small curated palette, assigned per-app in order of first appearance —
// deliberately not a random hash-to-color so the same handful of apps stay
// visually stable and legible across re-publishes.
const PALETTE = [
  { bg: '#3a2f1a', fg: '#e0b354' }, // brass/gold
  { bg: '#1a2f3a', fg: '#6fc2e0' }, // teal
  { bg: '#2f1a3a', fg: '#c79fe0' }, // violet
  { bg: '#1a3a24', fg: '#7fd8a0' }, // green
  { bg: '#3a1a24', fg: '#e08a9f' }, // rose
  { bg: '#3a2a1a', fg: '#e0a25f' }, // amber
];

// Known apps get a hand-picked glyph; anything new falls back to its own
// first character so a brand-new project still gets a distinct badge
// without needing a code change here.
const ICONS = {
  'releasepilot': '🚀',
  '사계기록': '🃏',
};

function iconFor(appName) {
  const key = appName.toLowerCase();
  return ICONS[key] || appName.trim().charAt(0).toUpperCase() || '·';
}

function colorFor(appName, order) {
  return PALETTE[order % PALETTE.length];
}

function slugId(appName) {
  return 'app-' + appName.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '');
}

fetch('reports/manifest.json').then(r => r.ok ? r.json() : []).then(items => {
  if (!items.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  // Group by appName, newest first within each group.
  const byApp = new Map();
  items.forEach(it => {
    if (!byApp.has(it.appName)) byApp.set(it.appName, []);
    byApp.get(it.appName).push(it);
  });
  byApp.forEach(list => list.sort((a, b) => (b.publishedAt || '').localeCompare(a.publishedAt || '')));

  const appsEl = document.getElementById('apps');
  const groupsEl = document.getElementById('groups');
  let order = 0;

  byApp.forEach((reports, appName) => {
    const color = colorFor(appName, order);
    const glyph = iconFor(appName);
    const id = slugId(appName);
    order++;

    const tile = document.createElement('a');
    tile.className = 'app-tile';
    tile.href = '#' + id;
    tile.innerHTML = `
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <div class="name">${appName}</div>
      <div class="count">${reports.length}건</div>`;
    appsEl.appendChild(tile);

    const group = document.createElement('section');
    group.className = 'app-group';
    group.id = id;
    const head = document.createElement('div');
    head.className = 'app-group-head';
    head.innerHTML = `
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <div><h2>${appName}</h2><div class="sub">${reports.length}건의 리포트</div></div>`;
    group.appendChild(head);

    reports.forEach(it => {
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = 'reports/' + it.file;
      card.style.borderLeftColor = color.fg;
      const date = (it.publishedAt || '').slice(0, 10);
      card.innerHTML = `
        <p class="report-title">${it.intent}</p>
        <div class="report-meta">
          <span class="kind">${it.reportKind}</span>
          <span>v${it.version}</span>
          <span>rev.${it.reportRevision}</span>
          <span>${date}</span>
        </div>`;
      group.appendChild(card);
    });

    groupsEl.appendChild(group);
  });
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
});
</script>
