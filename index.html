<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 허브 · ReleasePilot</title>
<meta name="description" content="ReleasePilot이 게시한 사용법 기획서·전략 리포트를 앱별로 모아보는 허브">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리포트 허브">
<meta name="theme-color" content="#fbfaf7">
<style>
  /* Light, high-contrast theme by deliberate choice — not tied to system
     dark mode. A previous dark version was reported hard to focus on and
     read, especially on mobile, so this page always stays light. Palette
     shares the amber accent + serif-headline identity used across every
     published report page, so the hub reads as the same product family. */
  :root {
    --bg: #fbfaf7; --card: #ffffff; --card-2: #f6f3ec; --line: #e9e3d6;
    --ink: #1d1b17; --ink-dim: #6b6a5f; --ink-faint: #a3a091;
    --accent: #c9711f; --accent-soft: #f6e6d3; --accent-ink: #7a4413;
    --good: #2f7a63; --good-soft: #dcefe8;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --shadow-1: 0 1px 2px rgba(29,27,23,0.05), 0 1px 1px rgba(29,27,23,0.03);
    --shadow-2: 0 12px 28px -12px rgba(29,27,23,0.16), 0 2px 6px rgba(29,27,23,0.05);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle at 12% 0%, #fdf6ea 0%, transparent 45%);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 96px; }

  /* ── Hero — the "Apple product page" opener: huge serif headline, quiet
     supporting copy, generous air above/below ─────────────────────────── */
  .hero {
    padding: 76px 4px 44px; text-align: center; max-width: 620px; margin: 0 auto;
  }
  .eyebrow {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft);
    border-radius: 999px; padding: 5px 14px; margin: 0 0 22px;
  }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 8vw, 56px);
    line-height: 1.08; letter-spacing: -0.01em; margin: 0 0 18px; text-wrap: balance;
    color: var(--ink);
  }
  .hero p { margin: 0 auto; font-size: 16px; line-height: 1.65; color: var(--ink-dim); max-width: 42ch; }
  .privacy-note {
    margin: 16px auto 0 !important; max-width: 38ch !important; font-size: 12px !important;
    line-height: 1.55 !important; color: var(--ink-faint) !important;
    background: var(--card-2); border-radius: 12px; padding: 10px 16px;
  }

  /* ── Section headers ──────────────────────────────────────────────── */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 16px; margin-top: 64px; }
  .section-head h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: -0.005em; }
  .section-head .hint { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Relationship diagram — nodes on a connecting rail, like a transit map */
  .flow {
    display: flex; align-items: flex-start; gap: 0; overflow-x: auto;
    padding: 10px 2px 18px; -webkit-overflow-scrolling: touch; position: relative;
  }
  .flow-node {
    flex: none; width: 122px; display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 8px; padding: 18px 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-1);
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s ease;
  }
  .flow-node:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
  .flow-node .glyph {
    font-size: 24px; width: 44px; height: 44px; display: flex; align-items: center;
    justify-content: center; background: var(--accent-soft); border-radius: 12px;
  }
  .flow-node { width: 148px; }
  .flow-node .label { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
  .flow-node .tag { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-ink); }
  .flow-node .desc { font-size: 10.5px; line-height: 1.4; color: var(--ink-dim); }
  .flow-arrow { flex: none; width: 30px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 16px; margin-top: 32px; }

  /* Menu cards — magazine cover grid, lift-on-hover like an App Store shelf */
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr; }
  }
  .menu-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 20px 18px;
    box-shadow: var(--shadow-1); text-align: left; cursor: pointer;
    font-family: inherit; color: inherit; display: flex; flex-direction: column; gap: 10px;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .menu-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .menu-card:active { transform: translateY(-1px) scale(0.99); }
  .menu-card .top { display: flex; align-items: center; justify-content: space-between; }
  .menu-card .glyph-badge {
    width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center;
    justify-content: center; font-size: 21px; flex: none;
  }
  .menu-card .count-pill {
    font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--ink-faint);
    background: var(--card-2); border-radius: 999px; padding: 3px 10px;
  }
  .menu-card .title { font-family: var(--serif); font-size: 17px; font-weight: 400; margin: 0; line-height: 1.3; }
  .menu-card .desc { font-size: 12.5px; line-height: 1.55; color: var(--ink-dim); }

  /* ── Detail (magazine spread) view ───────────────────────────────── */
  .detail-view { display: none; }
  .detail-view.open { display: block; animation: slideIn 0.28s cubic-bezier(.2,.8,.2,1); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .back-btn {
    display: inline-flex; align-items: center; gap: 5px; background: none; border: none;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700; color: var(--accent-ink);
    cursor: pointer; padding: 8px 2px; margin: 24px 0 6px; transition: gap 0.15s ease;
  }
  .back-btn:hover { gap: 8px; }
  .detail-hero {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 26px 22px; margin-bottom: 20px;
    box-shadow: var(--shadow-1); display: flex; gap: 18px; align-items: flex-start;
  }
  .detail-hero .glyph-badge { width: 58px; height: 58px; border-radius: 16px; font-size: 28px; }
  .detail-hero h3 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 8px; }
  .detail-hero p { font-size: 13.5px; line-height: 1.65; color: var(--ink-dim); margin: 0; }

  .cover-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .cover-card {
    display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; text-decoration: none; color: inherit; box-shadow: var(--shadow-1);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cover-card:hover { transform: translateX(2px); box-shadow: var(--shadow-2); }
  .cover-card .glyph-badge { width: 46px; height: 46px; border-radius: 13px; font-size: 21px; flex: none; }
  .cover-card .body { flex: 1; min-width: 0; }
  .cover-card .app-name { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .cover-card .title {
    font-size: 14.5px; font-weight: 600; line-height: 1.4; margin: 3px 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cover-card .meta { font-size: 11px; color: var(--ink-faint); }
  .cover-card .chev { color: var(--ink-faint); font-size: 16px; flex: none; }

  /* 같은 앱의 여러 개정판을 하나로 묶는 컨테이너 — 최신판(cover-card) 아래에
     "이전 버전 N개 보기" 토글, 펼치면 older-list가 나타난다. */
  .cover-group { margin-bottom: 12px; }
  .cover-group .cover-card { border-radius: 16px 16px 0 0; margin-bottom: 0; }
  .cover-group .older-toggle {
    width: 100%; text-align: left; background: var(--card-2); border: 1px solid var(--line); border-top: none;
    padding: 9px 16px; font-family: var(--sans); font-size: 12px;
    color: var(--accent-ink); font-weight: 700; cursor: pointer;
  }
  .cover-group .older-list { display: none; background: var(--card); border: 1px solid var(--line); border-top: none; border-radius: 0 0 16px 16px; overflow: hidden; }
  .cover-group .older-list.open { display: block; }
  .cover-group .older-list .cover-card {
    border: none; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line);
    padding: 11px 16px 11px 26px; opacity: 0.85;
  }
  .cover-group .older-list .cover-card .title { font-size: 13px; font-weight: 500; }

  /* ── Existing per-app grouped view ───────────────────────────────── */
  .apps { display: flex; gap: 22px; overflow-x: auto; padding: 6px 4px 8px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .app-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-decoration: none; color: inherit; flex: none; width: 72px;
    transition: transform 0.15s ease;
  }
  .app-tile:hover { transform: translateY(-2px); }
  .app-icon {
    width: 62px; height: 62px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: var(--shadow-2);
  }
  .app-tile .name { font-size: 11.5px; text-align: center; color: var(--ink); font-weight: 600; }
  .app-tile .count { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }

  .app-group { margin-top: 36px; }
  .app-group-head { display: flex; align-items: center; gap: 12px; padding: 0 2px 12px; }
  .app-group-head .app-icon { width: 32px; height: 32px; font-size: 15px; border-radius: 9px; box-shadow: none; }
  .app-group-head h2 { font-family: var(--serif); font-size: 18px; font-weight: 400; margin: 0; color: var(--ink); }

  .kind-block {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow-1);
    margin-bottom: 12px;
  }
  .kind-label {
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent-ink); padding: 14px 16px 0;
  }
  .report-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px;
    text-decoration: none; color: inherit; transition: background 0.15s ease;
  }
  .report-row:hover { background: var(--card-2); }
  .report-row + .report-row { border-top: 1px solid var(--line); padding-top: 12px; }
  .report-row .body { flex: 1; min-width: 0; }
  .report-title {
    font-size: 14.5px; font-weight: 600; line-height: 1.4; color: var(--ink); margin: 0 0 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .report-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .chev { color: var(--ink-faint); font-size: 16px; flex: none; }

  .older-toggle {
    width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--line);
    padding: 10px 16px; font-family: var(--sans); font-size: 12px; color: var(--accent-ink); font-weight: 700;
    cursor: pointer;
  }
  .older-list { display: none; }
  .older-list.open { display: block; }
  .older-list .report-row { padding: 9px 16px 9px 26px; }
  .older-list .report-title { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--ink-dim); }

  .empty { font-size: 14px; color: var(--ink-faint); padding: 40px 4px; text-align: center; }
  footer { margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-align: center; letter-spacing: 0.02em; }
</style>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">ReleasePilot · 프로젝트 통합 리포트 허브</p>
    <h1>모든 앱의 결정이,<br>한곳에 쌓입니다.</h1>
    <p>시장 분석부터 MVP 결정, 출시 전략까지 — 앱별 리포트 저장소.
       최신 버전만 표시, 이전 버전은 펼쳐서 확인.</p>
    <p class="privacy-note">현재는 개발자 개인 전용 도구 — 외부 공개 시 자신의 Claude로
       직접 실행하는 방식(개발자 서버 미경유)을 먼저 제공할 예정.</p>
  </div>

  <!-- 리포트 종류 메뉴 + 관계도 -->
  <div id="menuView">
    <div class="section-head"><h2>어떻게 이어지나</h2><span class="hint">Scroll →</span></div>
    <div class="flow" id="flow"></div>

    <div class="section-head"><h2>리포트 종류</h2><span class="hint">Tap to explore</span></div>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <!-- 메뉴 카드를 누르면 여기로 전환되는 매거진 스타일 상세 화면 -->
  <div class="detail-view" id="detailView">
    <button class="back-btn" id="backBtn">‹ 메뉴로</button>
    <div class="detail-hero" id="detailHero"></div>
    <div class="cover-grid" id="detailGrid"></div>
  </div>

  <div id="appsView">
    <div class="section-head"><h2>앱별로 보기</h2><span class="hint">By App</span></div>
    <div class="apps" id="apps"></div>
    <div id="groups"></div>
  </div>

  <p class="empty" id="empty" style="display:none;">아직 게시된 리포트 없음.</p>
  <footer>ReleasePilot Report Hub</footer>
</div>

<script>
// Curated palette assigned per-app in order of first appearance — stable
// across re-publishes instead of a random hash-to-color.
const PALETTE = [
  { bg: '#f0c265', fg: '#3a2a10' },
  { bg: '#7fc7e0', fg: '#0e2933' },
  { bg: '#c9a3ea', fg: '#2a1a3a' },
  { bg: '#8fe0af', fg: '#12331f' },
  { bg: '#eda3b5', fg: '#3a1420' },
  { bg: '#eec089', fg: '#3a2510' },
];

const ICONS = { 'releasepilot': '🚀', '사계기록': '🃏' };

// The order a report kind appears in an app's actual planning workflow —
// CTR/targeting analysis comes first, then MVP decisions, then reference
// docs like the usage guide. Unlisted kinds sort after these, alphabetically.
const KIND_ORDER = [
  'app_blueprint',
  'region_target_ctr',
  'route_candidates',
  'mvp_consultation',
  'reliability_gtm_strategy',
  'regional_fit_expansion_plan',
  'must_board',
  'feedback_loop',
  'game_design_blueprint',
  'usage_guide_worklog',
  'future_viability',
];
const KIND_LABELS = {
  'app_blueprint': '앱 블루프린트',
  'region_target_ctr': '지역·타겟 클릭률 분석',
  'route_candidates': '타겟 후보 비교',
  'mvp_consultation': 'MVP 상담',
  'reliability_gtm_strategy': '출시 반응 예측 · 마케팅 전략',
  'regional_fit_expansion_plan': '지역 적합도 + 확장 기획',
  'must_board': 'Must 현황판',
  'feedback_loop': '반려 피드백 기록',
  'game_design_blueprint': '게임 기획서',
  'usage_guide_worklog': '사용법 기획서',
  'future_viability': '미래 가능성 분석',
  'feature_concept_blueprint': '신규 기능 블루프린트',
};
// Intuitive, "이게 뭐 하는 리포트인지" 한눈에 알 수 있는 설명 — 메뉴판의
// 요리 설명처럼, 전문용어 대신 실제로 뭘 얻는지로 씀.
//
// 규칙: 새 리포트 종류(reportKind)가 생기면, "설명이 아직 없습니다" 같은
// 빈 메시지로 방치하지 말고 이 자리에 실제 설명을 채워 넣는다. 코드에서
// 자동 생성하는 kindDesc()의 폴백은 사람이 채우기 전까지의 임시 방편일
// 뿐, 최종 상태가 아니다.
const KIND_DESC = {
  'app_blueprint': '앱 코드를 직접 읽어 핵심 기능·부가 기능·숨은 제약사항을 정리한 조사 결과.',
  'region_target_ctr': '어떤 지역·타겟에 광고하면 클릭이 잘 나올지, 클릭률(CTR) 벤치마크로 계산한 첫 시장 진단.',
  'route_candidates': '클릭률로 비교한 여러 타겟·채널 후보 — 그중 하나를 골라 집중 개발하기 위한 비교표.',
  'mvp_consultation': '핵심 기능부터 홍보 문구까지, 대화로 하나씩 정한 MVP 결정 모음.',
  'reliability_gtm_strategy': '지금 그대로 출시하면 반응이 어떨지, 어디서·누구에게·무엇을 강조해야 잘 될지에 대한 예측.',
  'regional_fit_expansion_plan': '후보 지역이 지금 코드·5~10년 뒤 흐름과 얼마나 맞는지 점수로 매겨, 어디서 먼저 출시할지 제안하는 확장 기획.',
  'must_board': '지금 결정해야 할 질문과, 이미 확정된 Must 체크리스트를 한곳에 모은 현황판.',
  'feedback_loop': '스토어 반려 사유와 해결 여부를 추적한 기록.',
  'game_design_blueprint': '게임의 세계관·모드·진행 방식·승패 조건을 담은 기획서.',
  'usage_guide_worklog': '처음 보는 사람도 화면별로 어떻게 쓰는지 알 수 있는 사용설명서 겸 작업 일지.',
  'future_viability': '지금 방향으로 갔을 때 1~3년 뒤 살아남을지에 대한 장기 전망.',
  'feature_concept_blueprint': '아직 코드 없는 신규 기능의 개념 정의 — 이후 리포트가 근거로 삼는 문서.',
};
const KIND_GLYPH = {
  'app_blueprint': '🔎',
  'region_target_ctr': '🧭',
  'route_candidates': '🧭',
  'mvp_consultation': '🗒️',
  'reliability_gtm_strategy': '📈',
  'regional_fit_expansion_plan': '🌍',
  'must_board': '✅',
  'feedback_loop': '🚦',
  'game_design_blueprint': '🎮',
  'usage_guide_worklog': '📘',
  'future_viability': '🔭',
  'feature_concept_blueprint': '🧪',
};
// 관계도에 쓰는, 자연스러운 기획 흐름 — 실제로는 앱마다 순서가 다를 수 있지만
// "보통 이렇게 이어진다"는 기본 경로를 보여줌.
const FLOW = ['app_blueprint', 'region_target_ctr', 'route_candidates', 'mvp_consultation', 'reliability_gtm_strategy', 'feedback_loop'];
// 관계도 카드 안 한 줄 설명 — 라벨만 보고는 뭘 하는 단계인지 알기 어려워서
// (용어를 몰라도) 바로 이해되게 짧게 추가. KIND_DESC 전체 문장 대신 훨씬
// 짧은 버전을 따로 둔다 — 좁은 카드 안에서 한 줄~두 줄로 끝나야 하므로.
const FLOW_DESC = {
  'app_blueprint': '코드로 핵심 기능 파악',
  'region_target_ctr': '어디서 잘 될지 진단',
  'route_candidates': '후보 나란히 비교',
  'mvp_consultation': 'MVP 결정',
  'reliability_gtm_strategy': '출시 반응 예측',
  'feedback_loop': '반려 대응·기록',
};

function iconFor(appName) {
  return ICONS[appName.toLowerCase()] || appName.trim().charAt(0).toUpperCase() || '·';
}
// "region_target_ctr" → "Region Target Ctr" — 등록 안 된 새 종류라도 코드만
// 보고 방치하지 않도록, 최소한 사람이 읽을 만한 이름·설명을 즉석에서 만든다.
// 사람이 KIND_LABELS/KIND_DESC를 채우기 전까지의 임시 표시일 뿐이다.
function humanizeKind(kind) {
  return kind.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function kindLabel(kind) { return KIND_LABELS[kind] || humanizeKind(kind); }
function kindDesc(kind) {
  if (KIND_DESC[kind]) return KIND_DESC[kind];
  return `"${humanizeKind(kind)}" 종류의 리포트입니다 (자세한 소개 문구는 아직 준비 중 — 아래에서 실제 리포트를 열어 내용을 확인할 수 있어요).`;
}
function kindGlyph(kind) { return KIND_GLYPH[kind] || '📄'; }
function kindRank(kind) {
  const i = KIND_ORDER.indexOf(kind);
  return i === -1 ? KIND_ORDER.length : i;
}
function slugId(name) {
  return 'app-' + name.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '');
}

function reportRow(it, isLatest) {
  const date = (it.publishedAt || '').slice(0, 10);
  const a = document.createElement('a');
  a.className = 'report-row';
  a.href = 'reports/' + it.file;
  a.innerHTML = `
    <div class="body">
      <p class="report-title">${it.intent}</p>
      <div class="report-meta">v${it.version} · rev.${it.reportRevision} · ${date}</div>
    </div>
    <span class="chev">›</span>`;
  return a;
}

function buildFlow() {
  const flowEl = document.getElementById('flow');
  FLOW.forEach((kind, i) => {
    const node = document.createElement('div');
    node.className = 'flow-node';
    node.innerHTML = `<div class="glyph">${kindGlyph(kind)}</div>
      <div class="tag">${i === 0 ? 'START' : i === FLOW.length - 1 ? 'END' : ''}</div>
      <div class="label">${kindLabel(kind)}</div>
      <div class="desc">${FLOW_DESC[kind] || ''}</div>`;
    flowEl.appendChild(node);
    if (i < FLOW.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'flow-arrow';
      arrow.textContent = '→';
      flowEl.appendChild(arrow);
    }
  });
}

function coverCard(it, color) {
  const date = (it.publishedAt || '').slice(0, 10);
  const a = document.createElement('a');
  a.className = 'cover-card';
  a.href = 'reports/' + it.file;
  a.innerHTML = `
    <div class="glyph-badge" style="background:${color.bg};color:${color.fg}">${iconFor(it.appName)}</div>
    <div class="body">
      <div class="app-name">${it.appName}</div>
      <div class="title">${it.intent}</div>
      <div class="meta">v${it.version} · rev.${it.reportRevision} · ${date}</div>
    </div>
    <span class="chev">›</span>`;
  return a;
}

// 여러 개정판이 있으면 혼동되므로, 앱마다 "가장 최근 것"만 위에 하나처럼
// 보여주고 나머지는 토글로 펼쳐서 본다 — 아래 앱별 모아보기 섹션의
// kind-block/older-toggle과 동일한 규칙을 여기(종류별 상세)에도 그대로 적용.
// kind === '__beta__'는 reportKind가 아니라 manifest 항목의 beta:true 플래그로
// 걸러내는 특수 카테고리 — "종류"가 아니라 "상태"로 묶는 유일한 목차라서
// 별도 분기로 처리한다. 관리자가 게시할 때 beta:true만 붙이면 리포트 종류에
// 상관없이 여기 모인다.
function openDetail(kind, allItems) {
  const isBeta = kind === '__beta__';
  const matches = isBeta
    ? allItems.filter(it => it.beta === true)
    : allItems.filter(it => it.reportKind === kind);

  document.getElementById('detailHero').innerHTML = isBeta
    ? `
    <div class="glyph-badge" style="background:#fdf0d8;color:#a3690a">🧪</div>
    <div>
      <h3>베타 기능</h3>
      <p>아직 정식 기능이 아닌 실험 단계 컨셉/모듈 모음 — 종류 상관없이 한곳에 정리.</p>
    </div>`
    : `
    <div class="glyph-badge" style="background:#e7edf6;color:var(--accent)">${kindGlyph(kind)}</div>
    <div>
      <h3>${kindLabel(kind)}</h3>
      <p>${kindDesc(kind)}</p>
    </div>`;

  const grid = document.getElementById('detailGrid');
  grid.innerHTML = '';
  if (!matches.length) {
    grid.innerHTML = '<p class="empty">아직 이 종류로 게시된 리포트가 없습니다.</p>';
    document.getElementById('menuView').style.display = 'none';
    document.getElementById('appsView').style.display = 'none';
    document.getElementById('detailView').classList.add('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  // 같은 앱의 같은 종류 리포트를 하나로 묶고, 최신 개정판만 대표로 노출.
  // 베타 목차는 reportKind가 서로 다른 문서들을 한데 모으므로, appName만으로
  // 묶으면 서로 다른 종류의 리포트가 "같은 것의 이전 버전"처럼 잘못 합쳐진다
  // — appName+reportKind를 묶음 키로 써서 이 문제를 피한다.
  const byApp = new Map();
  matches.forEach(it => {
    const key = isBeta ? `${it.appName}::${it.reportKind}` : it.appName;
    if (!byApp.has(key)) byApp.set(key, []);
    byApp.get(key).push(it);
  });

  let i = 0;
  byApp.forEach((list, appName) => {
    list.sort((a, b) => b.reportRevision - a.reportRevision);
    const [latest, ...older] = list;
    const color = PALETTE[i % PALETTE.length];
    i++;

    const card = coverCard(latest, color);
    if (older.length) {
      const wrap = document.createElement('div');
      wrap.className = 'cover-group';
      wrap.appendChild(card);
      const toggle = document.createElement('button');
      toggle.className = 'older-toggle';
      toggle.textContent = `이전 버전 ${older.length}개 보기 ▾`;
      const olderList = document.createElement('div');
      olderList.className = 'older-list';
      older.forEach(it => olderList.appendChild(coverCard(it, color)));
      toggle.addEventListener('click', () => {
        const open = olderList.classList.toggle('open');
        toggle.textContent = open ? '이전 버전 접기 ▴' : `이전 버전 ${older.length}개 보기 ▾`;
      });
      wrap.appendChild(toggle);
      wrap.appendChild(olderList);
      grid.appendChild(wrap);
    } else {
      grid.appendChild(card);
    }
  });

  document.getElementById('menuView').style.display = 'none';
  document.getElementById('appsView').style.display = 'none';
  document.getElementById('detailView').classList.add('open');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  document.getElementById('menuView').style.display = '';
  document.getElementById('appsView').style.display = '';
}

document.getElementById('backBtn').addEventListener('click', closeDetail);

// cache: 'no-store' — 새 리포트를 올려도 브라우저(특히 iOS Safari)가 이전
// manifest.json을 캐시에서 그대로 재사용해 "방금 올린 게 안 보인다"는
// 문제가 반복돼(2026-08-03), 매번 네트워크에서 새로 받도록 강제한다.
fetch('reports/manifest.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(items => {
  buildFlow();

  // 리포트 메뉴 — 실제로 존재하는 종류만 보여주되, 하나도 없는 경우는 숨김.
  const menuGrid = document.getElementById('menuGrid');

  // 베타 항목은 자기 reportKind 메뉴에도 동시에 뜨면 같은 리포트가 두 곳에
  // 중복 노출돼 헷갈린다("베타 기능" 카드랑 "신규 기능 블루프린트" 카드가
  // 사실상 같은 1~2건을 따로 보여주던 문제, 2026-08-02 피드백) — 그래서
  // 베타 항목은 일반 종류별 메뉴/앱별 모아보기에서 완전히 빼고, "베타 기능"
  // 카드 하나로만 접근하게 합친다. 같은 리포트가 두 목차에 동시에 있지 않다.
  const betaItems = items.filter(it => it.beta === true);
  const nonBetaItems = items.filter(it => it.beta !== true);

  // 베타 기능은 reportKind가 아니라 상태(beta:true)로 묶는 카테고리라서
  // 항상 메뉴 맨 앞에 고정 — 종류가 늘어도 관리자가 찾기 쉽게.
  if (betaItems.length) {
    const betaCard = document.createElement('button');
    betaCard.className = 'menu-card';
    betaCard.innerHTML = `
      <div class="top">
        <div class="glyph-badge" style="background:#fdf0d8;color:#a3690a">🧪</div>
        <span class="count-pill">${betaItems.length}건</span>
      </div>
      <p class="title">베타 기능</p>
      <p class="desc">아직 실험 중인 컨셉/모듈 리포트 모음 — 정식 종류로 분류되기 전 단계</p>`;
    betaCard.addEventListener('click', () => openDetail('__beta__', items));
    menuGrid.appendChild(betaCard);
  }

  const kindsPresent = [...new Set(nonBetaItems.map(it => it.reportKind))].sort((a, b) => kindRank(a) - kindRank(b));
  kindsPresent.forEach((kind, i) => {
    // 개정판(rev)마다 따로 세면 사실 같은 리포트인데도 "5건"처럼 부풀려
    // 보인다(2026-08-03 피드백: "중복되거나 쓸모없는 데이터"). 상세보기가
    // 이미 앱별로 최신 개정판만 대표로 묶어 보여주므로(아래 openDetail),
    // 여기 배지 숫자도 그 앱 단위로 세어 항상 일치시킨다.
    const count = new Set(nonBetaItems.filter(it => it.reportKind === kind).map(it => it.appName)).size;
    const color = PALETTE[i % PALETTE.length];
    const card = document.createElement('button');
    card.className = 'menu-card';
    card.innerHTML = `
      <div class="top">
        <div class="glyph-badge" style="background:${color.bg};color:${color.fg}">${kindGlyph(kind)}</div>
        <span class="count-pill">${count}건</span>
      </div>
      <p class="title">${kindLabel(kind)}</p>
      <p class="desc">${kindDesc(kind)}</p>`;
    card.addEventListener('click', () => openDetail(kind, nonBetaItems));
    menuGrid.appendChild(card);
  });

  if (!nonBetaItems.length) { document.getElementById('empty').style.display = 'block'; return; }

  const byApp = new Map();
  nonBetaItems.forEach(it => {
    if (!byApp.has(it.appName)) byApp.set(it.appName, []);
    byApp.get(it.appName).push(it);
  });

  const appsEl = document.getElementById('apps');
  const groupsEl = document.getElementById('groups');
  let order = 0;

  byApp.forEach((reports, appName) => {
    const color = PALETTE[order % PALETTE.length];
    const glyph = iconFor(appName);
    const id = slugId(appName);
    order++;

    // Group by reportKind, newest revision first within each kind.
    const byKind = new Map();
    reports.forEach(it => {
      if (!byKind.has(it.reportKind)) byKind.set(it.reportKind, []);
      byKind.get(it.reportKind).push(it);
    });
    byKind.forEach(list => list.sort((a, b) => b.reportRevision - a.reportRevision));
    const kinds = [...byKind.keys()].sort((a, b) => kindRank(a) - kindRank(b));

    const tile = document.createElement('a');
    tile.className = 'app-tile';
    tile.href = '#' + id;
    tile.innerHTML = `
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <div class="name">${appName}</div>
      <div class="count">${kinds.length}종</div>`;
    appsEl.appendChild(tile);

    const group = document.createElement('section');
    group.className = 'app-group';
    group.id = id;
    group.innerHTML = `<div class="app-group-head">
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <h2>${appName} · CTR → MVP → 기획서 순</h2>
    </div>`;

    kinds.forEach(kind => {
      const list = byKind.get(kind);
      const [latest, ...older] = list;

      const block = document.createElement('div');
      block.className = 'kind-block';
      block.innerHTML = `<div class="kind-label">${kindLabel(kind)}</div>`;
      block.appendChild(reportRow(latest, true));

      if (older.length) {
        const toggle = document.createElement('button');
        toggle.className = 'older-toggle';
        toggle.textContent = `이전 버전 ${older.length}개 보기 ▾`;
        const olderList = document.createElement('div');
        olderList.className = 'older-list';
        older.forEach(it => olderList.appendChild(reportRow(it, false)));
        toggle.addEventListener('click', () => {
          const open = olderList.classList.toggle('open');
          toggle.textContent = open ? '이전 버전 접기 ▴' : `이전 버전 ${older.length}개 보기 ▾`;
        });
        block.appendChild(toggle);
        block.appendChild(olderList);
      }

      group.appendChild(block);
    });

    groupsEl.appendChild(group);
  });
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
});
</script>
