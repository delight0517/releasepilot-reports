<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 허브 · ReleasePilot</title>
<meta name="description" content="ReleasePilot이 게시한 사용법 기획서·전략 리포트를 앱별로 모아보는 허브">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리포트 허브">
<meta name="theme-color" content="#f2f2f7">
<style>
  /* Light, high-contrast theme by deliberate choice — not tied to system
     dark mode. A previous dark version was reported hard to focus on and
     read, especially on mobile, so this page always stays light. */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --line: #e3e3e8;
    --ink: #1c1c1e; --ink-dim: #6e6e73; --ink-faint: #9a9aa2;
    --accent: #3a6bb5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 80px; }

  .hero { padding: 8px 4px 20px; }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 6px;
  }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
  .hero p { margin: 0; font-size: 13px; color: var(--ink-dim); max-width: 56ch; }

  /* ── Section: 리포트 종류 (menu) ─────────────────────────────────── */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 10px; margin-top: 30px; }
  .section-head h2 { font-size: 15px; font-weight: 800; margin: 0; }
  .section-head .hint { font-size: 11px; color: var(--ink-faint); }

  /* Relationship diagram — a simple left-to-right pipeline, scrolls on mobile */
  .flow {
    display: flex; align-items: stretch; gap: 0; overflow-x: auto;
    padding: 6px 2px 14px; -webkit-overflow-scrolling: touch;
  }
  .flow-node {
    flex: none; width: 108px; display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 6px; padding: 12px 8px; background: var(--card);
    border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .flow-node .glyph { font-size: 22px; }
  .flow-node .label { font-size: 11px; font-weight: 700; line-height: 1.25; }
  .flow-node .desc { font-size: 9.5px; color: var(--ink-faint); line-height: 1.3; }
  .flow-arrow { flex: none; width: 26px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 15px; }

  /* Menu cards — like a food menu / magazine cover grid */
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .menu-card {
    background: var(--card); border-radius: 16px; padding: 14px 14px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04); text-align: left; border: none; cursor: pointer;
    font-family: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .menu-card:active { transform: scale(0.97); }
  .menu-card .top { display: flex; align-items: center; justify-content: space-between; }
  .menu-card .glyph-badge {
    width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center;
    justify-content: center; font-size: 19px; flex: none;
  }
  .menu-card .count-pill {
    font-size: 10px; font-weight: 700; color: var(--ink-faint); background: var(--bg);
    border-radius: 999px; padding: 2px 8px;
  }
  .menu-card .title { font-size: 13.5px; font-weight: 700; margin: 2px 0 0; }
  .menu-card .desc { font-size: 11.5px; color: var(--ink-dim); }

  /* ── Detail (magazine spread) view ───────────────────────────────── */
  .detail-view { display: none; }
  .detail-view.open { display: block; animation: slideIn 0.18s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .back-btn {
    display: inline-flex; align-items: center; gap: 5px; background: none; border: none;
    font-family: inherit; font-size: 13px; font-weight: 700; color: var(--accent);
    cursor: pointer; padding: 6px 2px; margin-bottom: 6px;
  }
  .detail-hero {
    background: var(--card); border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; gap: 14px; align-items: flex-start;
  }
  .detail-hero .glyph-badge { width: 52px; height: 52px; border-radius: 14px; font-size: 26px; }
  .detail-hero h3 { font-size: 16px; font-weight: 800; margin: 0 0 6px; }
  .detail-hero p { font-size: 12.5px; color: var(--ink-dim); margin: 0; }

  .cover-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .cover-card {
    display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 14px;
    padding: 12px 14px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .cover-card .glyph-badge { width: 42px; height: 42px; border-radius: 12px; font-size: 20px; flex: none; }
  .cover-card .body { flex: 1; min-width: 0; }
  .cover-card .app-name { font-size: 11px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.02em; }
  .cover-card .title { font-size: 14px; font-weight: 700; margin: 2px 0 3px; }
  .cover-card .meta { font-size: 11px; color: var(--ink-faint); }
  .cover-card .chev { color: var(--ink-faint); font-size: 15px; flex: none; }

  /* 같은 앱의 여러 개정판을 하나로 묶는 컨테이너 — 최신판(cover-card) 아래에
     "이전 버전 N개 보기" 토글, 펼치면 older-list가 나타난다. */
  .cover-group { margin-bottom: 10px; }
  .cover-group .cover-card { border-radius: 14px 14px 0 0; margin-bottom: 0; }
  .cover-group .older-toggle {
    width: 100%; text-align: left; background: var(--card); border: none;
    border-top: 1px solid var(--line); padding: 8px 14px; font-size: 12px;
    color: var(--accent); font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .cover-group .older-list { display: none; background: var(--card); border-radius: 0 0 14px 14px; overflow: hidden; }
  .cover-group .older-list.open { display: block; }
  .cover-group .older-list .cover-card {
    border-radius: 0; box-shadow: none; border-top: 1px solid var(--line);
    padding: 10px 14px 10px 24px; opacity: 0.85;
  }
  .cover-group .older-list .cover-card .title { font-size: 13px; font-weight: 500; }

  /* ── Existing per-app grouped view ───────────────────────────────── */
  .apps { display: flex; gap: 18px; overflow-x: auto; padding: 4px 4px 4px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .app-tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-decoration: none; color: inherit; flex: none; width: 64px;
  }
  .app-icon {
    width: 56px; height: 56px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .app-tile .name { font-size: 11px; text-align: center; color: var(--ink); font-weight: 600; }
  .app-tile .count { font-size: 10px; color: var(--ink-faint); }

  .app-group { margin-top: 28px; }
  .app-group-head { display: flex; align-items: center; gap: 10px; padding: 0 4px 8px; }
  .app-group-head .app-icon { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
  .app-group-head h2 { font-size: 13px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink-dim); }

  .kind-block {
    background: var(--card); border-radius: 14px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    margin-bottom: 10px;
  }
  .kind-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent); padding: 10px 14px 0;
  }
  .report-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px;
    text-decoration: none; color: inherit;
  }
  .report-row + .report-row { border-top: 1px solid var(--line); padding-top: 12px; }
  .report-row .body { flex: 1; min-width: 0; }
  .report-title { font-size: 14.5px; font-weight: 600; color: var(--ink); margin: 0 0 3px; }
  .report-meta { font-size: 11.5px; color: var(--ink-faint); }
  .chev { color: var(--ink-faint); font-size: 15px; flex: none; }

  .older-toggle {
    width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--line);
    padding: 9px 14px; font-size: 12px; color: var(--accent); font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .older-list { display: none; }
  .older-list.open { display: block; }
  .older-list .report-row { padding: 8px 14px 8px 24px; }
  .older-list .report-title { font-size: 13px; font-weight: 500; color: var(--ink-dim); }

  .empty { font-size: 13px; color: var(--ink-faint); padding: 24px 4px; }
  footer { margin-top: 40px; font-size: 10.5px; color: var(--ink-faint); text-align: center; }
</style>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Cross-project · GitHub Pages</p>
    <h1>리포트 허브</h1>
    <p>ReleasePilot의 "게시" 버튼으로 올린 사용법 기획서·전략 리포트를 앱별로 모아봅니다.
       각 항목은 최신판만 보이고, 이전 버전은 펼쳐서 볼 수 있어요.</p>
  </div>

  <!-- 리포트 종류 메뉴 + 관계도 -->
  <div id="menuView">
    <div class="section-head"><h2>리포트가 만들어지는 순서</h2><span class="hint">← 옆으로 스크롤</span></div>
    <div class="flow" id="flow"></div>

    <div class="section-head"><h2>🍽️ 리포트 메뉴 — 종류별로 골라보기</h2></div>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <!-- 메뉴 카드를 누르면 여기로 전환되는 매거진 스타일 상세 화면 -->
  <div class="detail-view" id="detailView">
    <button class="back-btn" id="backBtn">‹ 메뉴로</button>
    <div class="detail-hero" id="detailHero"></div>
    <div class="cover-grid" id="detailGrid"></div>
  </div>

  <div id="appsView">
    <div class="section-head"><h2>앱별로 모아보기</h2></div>
    <div class="apps" id="apps"></div>
    <div id="groups"></div>
  </div>

  <p class="empty" id="empty" style="display:none;">아직 게시된 리포트가 없습니다.</p>
  <footer>ReleasePilot 리포트 허브 · 정적 페이지, 빌드 없음</footer>
</div>

<script>
// Curated palette assigned per-app in order of first appearance — stable
// across re-publishes instead of a random hash-to-color.
const PALETTE = [
  { bg: '#f0c265', fg: '#3a2a10' },
  { bg: '#7fc7e0', fg: '#0e2933' },
  { bg: '#c9a3ea', fg: '#2a1a3a' },
  { bg: '#8fe0af', fg: '#12331f' },
  { bg: '#eda3b5', fg: '#3a1420' },
  { bg: '#eec089', fg: '#3a2510' },
];

const ICONS = { 'releasepilot': '🚀', '사계기록': '🃏' };

// The order a report kind appears in an app's actual planning workflow —
// CTR/targeting analysis comes first, then MVP decisions, then reference
// docs like the usage guide. Unlisted kinds sort after these, alphabetically.
const KIND_ORDER = [
  'app_blueprint',
  'region_target_ctr',
  'route_candidates',
  'mvp_consultation',
  'reliability_gtm_strategy',
  'regional_fit_expansion_plan',
  'feedback_loop',
  'game_design_blueprint',
  'usage_guide_worklog',
  'future_viability',
];
const KIND_LABELS = {
  'app_blueprint': '앱 블루프린트',
  'region_target_ctr': 'CTR · 지역·타겟 전략',
  'route_candidates': 'CTR 루트 후보',
  'mvp_consultation': 'MVP 상담',
  'reliability_gtm_strategy': '출시 반응 예측 · GTM 전략',
  'regional_fit_expansion_plan': '지역 적합도 점수 + 확장 기획안',
  'feedback_loop': '반려 피드백 기록',
  'game_design_blueprint': '게임 기획서',
  'usage_guide_worklog': '사용법 기획서',
  'future_viability': '미래 가능성 분석',
};
// Intuitive, "이게 뭐 하는 리포트인지" 한눈에 알 수 있는 설명 — 메뉴판의
// 요리 설명처럼, 전문용어 대신 실제로 뭘 얻는지로 씀.
//
// 규칙: 새 리포트 종류(reportKind)가 생기면, "설명이 아직 없습니다" 같은
// 빈 메시지로 방치하지 말고 이 자리에 실제 설명을 채워 넣는다. 코드에서
// 자동 생성하는 kindDesc()의 폴백은 사람이 채우기 전까지의 임시 방편일
// 뿐, 최종 상태가 아니다.
const KIND_DESC = {
  'app_blueprint': '이 앱의 실제 코드를 읽어서 "이게 빠지면 앱이 성립 안 하는" 핵심 기능 하나와 부가 기능, 숨은 제약사항을 정리한 조사 결과.',
  'region_target_ctr': '어떤 지역·타겟에게 광고했을 때 클릭이 잘 나올지, 근거 있는 벤치마크로 계산한 첫 시장 진단.',
  'route_candidates': 'CTR로 비교해본 여러 타겟·채널 조합 후보들 — 그중 하나를 골라 집중 개발할 수 있게 나란히 모아둔 목록.',
  'mvp_consultation': '핵심 기능부터 홍보 문구까지, 대화로 하나씩 정해나간 MVP 결정 사항 모음.',
  'reliability_gtm_strategy': '지금 그대로 출시하면 어떤 반응이 예상되는지, 그리고 어디서·누구에게·어떤 기능을 강조해야 성공 확률이 가장 높은지에 대한 심층 조사.',
  'regional_fit_expansion_plan': '계층별 반응·예상 수익까지 계산한 "지금 그대로" 진단에 이어서, 후보 지역들이 지금 코드와 얼마나 잘 맞는지·5~10년 뒤에도 잘 맞을지를 점수로 매기고, 그 결과로 어디서 먼저 출시할지 1~3가지 안을 제시하는 확장 기획안.',
  'feedback_loop': '스토어 반려 사유를 접수하고, 고친 버전·근거와 함께 해결 여부를 추적한 기록.',
  'game_design_blueprint': '게임의 세계관·모드·진행 방식과 승패 조건까지 담은 기획서.',
  'usage_guide_worklog': '이 앱을 처음 보는 사람도 화면별로 어떻게 쓰는지 알 수 있게 만든 사용설명서 겸 작업 일지.',
  'future_viability': '지금 방향으로 계속 갔을 때 1~3년 뒤 이 앱이 살아남을지에 대한 장기 전망.',
};
const KIND_GLYPH = {
  'app_blueprint': '🔎',
  'region_target_ctr': '🧭',
  'route_candidates': '🧭',
  'mvp_consultation': '🗒️',
  'reliability_gtm_strategy': '📈',
  'regional_fit_expansion_plan': '🌍',
  'feedback_loop': '🚦',
  'game_design_blueprint': '🎮',
  'usage_guide_worklog': '📘',
  'future_viability': '🔭',
};
// 관계도에 쓰는, 자연스러운 기획 흐름 — 실제로는 앱마다 순서가 다를 수 있지만
// "보통 이렇게 이어진다"는 기본 경로를 보여줌.
const FLOW = ['app_blueprint', 'region_target_ctr', 'route_candidates', 'mvp_consultation', 'reliability_gtm_strategy', 'feedback_loop'];

function iconFor(appName) {
  return ICONS[appName.toLowerCase()] || appName.trim().charAt(0).toUpperCase() || '·';
}
// "region_target_ctr" → "Region Target Ctr" — 등록 안 된 새 종류라도 코드만
// 보고 방치하지 않도록, 최소한 사람이 읽을 만한 이름·설명을 즉석에서 만든다.
// 사람이 KIND_LABELS/KIND_DESC를 채우기 전까지의 임시 표시일 뿐이다.
function humanizeKind(kind) {
  return kind.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function kindLabel(kind) { return KIND_LABELS[kind] || humanizeKind(kind); }
function kindDesc(kind) {
  if (KIND_DESC[kind]) return KIND_DESC[kind];
  return `"${humanizeKind(kind)}" 종류의 리포트입니다 (자세한 소개 문구는 아직 준비 중 — 아래에서 실제 리포트를 열어 내용을 확인할 수 있어요).`;
}
function kindGlyph(kind) { return KIND_GLYPH[kind] || '📄'; }
function kindRank(kind) {
  const i = KIND_ORDER.indexOf(kind);
  return i === -1 ? KIND_ORDER.length : i;
}
function slugId(name) {
  return 'app-' + name.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '');
}

function reportRow(it, isLatest) {
  const date = (it.publishedAt || '').slice(0, 10);
  const a = document.createElement('a');
  a.className = 'report-row';
  a.href = 'reports/' + it.file;
  a.innerHTML = `
    <div class="body">
      <p class="report-title">${it.intent}</p>
      <div class="report-meta">v${it.version} · rev.${it.reportRevision} · ${date}</div>
    </div>
    <span class="chev">›</span>`;
  return a;
}

function buildFlow() {
  const flowEl = document.getElementById('flow');
  FLOW.forEach((kind, i) => {
    const node = document.createElement('div');
    node.className = 'flow-node';
    node.innerHTML = `<div class="glyph">${kindGlyph(kind)}</div>
      <div class="label">${kindLabel(kind)}</div>
      <div class="desc">${i === 0 ? '먼저' : i === FLOW.length - 1 ? '마지막' : ''}</div>`;
    flowEl.appendChild(node);
    if (i < FLOW.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'flow-arrow';
      arrow.textContent = '→';
      flowEl.appendChild(arrow);
    }
  });
}

function coverCard(it, color) {
  const date = (it.publishedAt || '').slice(0, 10);
  const a = document.createElement('a');
  a.className = 'cover-card';
  a.href = 'reports/' + it.file;
  a.innerHTML = `
    <div class="glyph-badge" style="background:${color.bg};color:${color.fg}">${iconFor(it.appName)}</div>
    <div class="body">
      <div class="app-name">${it.appName}</div>
      <div class="title">${it.intent}</div>
      <div class="meta">v${it.version} · rev.${it.reportRevision} · ${date}</div>
    </div>
    <span class="chev">›</span>`;
  return a;
}

// 여러 개정판이 있으면 혼동되므로, 앱마다 "가장 최근 것"만 위에 하나처럼
// 보여주고 나머지는 토글로 펼쳐서 본다 — 아래 앱별 모아보기 섹션의
// kind-block/older-toggle과 동일한 규칙을 여기(종류별 상세)에도 그대로 적용.
function openDetail(kind, allItems) {
  const matches = allItems.filter(it => it.reportKind === kind);

  document.getElementById('detailHero').innerHTML = `
    <div class="glyph-badge" style="background:#e7edf6;color:var(--accent)">${kindGlyph(kind)}</div>
    <div>
      <h3>${kindLabel(kind)}</h3>
      <p>${kindDesc(kind)}</p>
    </div>`;

  const grid = document.getElementById('detailGrid');
  grid.innerHTML = '';
  if (!matches.length) {
    grid.innerHTML = '<p class="empty">아직 이 종류로 게시된 리포트가 없습니다.</p>';
    document.getElementById('menuView').style.display = 'none';
    document.getElementById('appsView').style.display = 'none';
    document.getElementById('detailView').classList.add('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  // 같은 앱의 같은 종류 리포트를 하나로 묶고, 최신 개정판만 대표로 노출.
  const byApp = new Map();
  matches.forEach(it => {
    if (!byApp.has(it.appName)) byApp.set(it.appName, []);
    byApp.get(it.appName).push(it);
  });

  let i = 0;
  byApp.forEach((list, appName) => {
    list.sort((a, b) => b.reportRevision - a.reportRevision);
    const [latest, ...older] = list;
    const color = PALETTE[i % PALETTE.length];
    i++;

    const card = coverCard(latest, color);
    if (older.length) {
      const wrap = document.createElement('div');
      wrap.className = 'cover-group';
      wrap.appendChild(card);
      const toggle = document.createElement('button');
      toggle.className = 'older-toggle';
      toggle.textContent = `이전 버전 ${older.length}개 보기 ▾`;
      const olderList = document.createElement('div');
      olderList.className = 'older-list';
      older.forEach(it => olderList.appendChild(coverCard(it, color)));
      toggle.addEventListener('click', () => {
        const open = olderList.classList.toggle('open');
        toggle.textContent = open ? '이전 버전 접기 ▴' : `이전 버전 ${older.length}개 보기 ▾`;
      });
      wrap.appendChild(toggle);
      wrap.appendChild(olderList);
      grid.appendChild(wrap);
    } else {
      grid.appendChild(card);
    }
  });

  document.getElementById('menuView').style.display = 'none';
  document.getElementById('appsView').style.display = 'none';
  document.getElementById('detailView').classList.add('open');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  document.getElementById('menuView').style.display = '';
  document.getElementById('appsView').style.display = '';
}

document.getElementById('backBtn').addEventListener('click', closeDetail);

fetch('reports/manifest.json').then(r => r.ok ? r.json() : []).then(items => {
  buildFlow();

  // 리포트 메뉴 — 실제로 존재하는 종류만 보여주되, 하나도 없는 경우는 숨김.
  const kindsPresent = [...new Set(items.map(it => it.reportKind))].sort((a, b) => kindRank(a) - kindRank(b));
  const menuGrid = document.getElementById('menuGrid');
  kindsPresent.forEach((kind, i) => {
    const count = items.filter(it => it.reportKind === kind).length;
    const color = PALETTE[i % PALETTE.length];
    const card = document.createElement('button');
    card.className = 'menu-card';
    card.innerHTML = `
      <div class="top">
        <div class="glyph-badge" style="background:${color.bg};color:${color.fg}">${kindGlyph(kind)}</div>
        <span class="count-pill">${count}건</span>
      </div>
      <p class="title">${kindLabel(kind)}</p>
      <p class="desc">${kindDesc(kind)}</p>`;
    card.addEventListener('click', () => openDetail(kind, items));
    menuGrid.appendChild(card);
  });

  if (!items.length) { document.getElementById('empty').style.display = 'block'; return; }

  const byApp = new Map();
  items.forEach(it => {
    if (!byApp.has(it.appName)) byApp.set(it.appName, []);
    byApp.get(it.appName).push(it);
  });

  const appsEl = document.getElementById('apps');
  const groupsEl = document.getElementById('groups');
  let order = 0;

  byApp.forEach((reports, appName) => {
    const color = PALETTE[order % PALETTE.length];
    const glyph = iconFor(appName);
    const id = slugId(appName);
    order++;

    // Group by reportKind, newest revision first within each kind.
    const byKind = new Map();
    reports.forEach(it => {
      if (!byKind.has(it.reportKind)) byKind.set(it.reportKind, []);
      byKind.get(it.reportKind).push(it);
    });
    byKind.forEach(list => list.sort((a, b) => b.reportRevision - a.reportRevision));
    const kinds = [...byKind.keys()].sort((a, b) => kindRank(a) - kindRank(b));

    const tile = document.createElement('a');
    tile.className = 'app-tile';
    tile.href = '#' + id;
    tile.innerHTML = `
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <div class="name">${appName}</div>
      <div class="count">${reports.length}건</div>`;
    appsEl.appendChild(tile);

    const group = document.createElement('section');
    group.className = 'app-group';
    group.id = id;
    group.innerHTML = `<div class="app-group-head">
      <div class="app-icon" style="background:${color.bg};color:${color.fg}">${glyph}</div>
      <h2>${appName} · CTR → MVP → 기획서 순</h2>
    </div>`;

    kinds.forEach(kind => {
      const list = byKind.get(kind);
      const [latest, ...older] = list;

      const block = document.createElement('div');
      block.className = 'kind-block';
      block.innerHTML = `<div class="kind-label">${kindLabel(kind)}</div>`;
      block.appendChild(reportRow(latest, true));

      if (older.length) {
        const toggle = document.createElement('button');
        toggle.className = 'older-toggle';
        toggle.textContent = `이전 버전 ${older.length}개 보기 ▾`;
        const olderList = document.createElement('div');
        olderList.className = 'older-list';
        older.forEach(it => olderList.appendChild(reportRow(it, false)));
        toggle.addEventListener('click', () => {
          const open = olderList.classList.toggle('open');
          toggle.textContent = open ? '이전 버전 접기 ▴' : `이전 버전 ${older.length}개 보기 ▾`;
        });
        block.appendChild(toggle);
        block.appendChild(olderList);
      }

      group.appendChild(block);
    });

    groupsEl.appendChild(group);
  });
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
});
</script>
