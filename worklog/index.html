<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 일지 · VIVID</title>
<meta name="description" content="차실장·클로이 박·박새로이가 실제로 한 일을 날짜별로 기록한 일지 — 지어낸 실적이 아니라 실제 커밋·수정 기준.">
<link rel="icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#ece1c4">
<style>
  :root {
    --bg: #ece1c4; --paper: #f6efdb; --paper-2: #e9dcb8; --line: #cdbb8c;
    --ink: #2b2415; --ink-dim: #5a4e34; --ink-faint: #8a7c56;
    --seal: #9c3b2c; --seal-soft: rgba(156,59,44,0.1); --seal-ink: #7a2e22;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif KR", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171410; --paper: #211d16; --paper-2: #2a251a; --line: #423a27;
      --ink: #ece2c8; --ink-dim: #bcae8c; --ink-faint: #7d715a;
      --seal: #d1725c; --seal-soft: rgba(209,114,92,0.14); --seal-ink: #e39684;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171410; --paper: #211d16; --paper-2: #2a251a; --line: #423a27;
    --ink: #ece2c8; --ink-dim: #bcae8c; --ink-faint: #7d715a;
    --seal: #d1725c; --seal-soft: rgba(209,114,92,0.14); --seal-ink: #e39684;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px 100px; }
  .back-link {
    position: fixed; top: 16px; left: 16px; z-index: 5; font-family: var(--mono);
    font-size: 10.5px; color: var(--ink-faint); text-decoration: none;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  header { padding: 72px 4px 8px; text-align: center; }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--seal-ink); background: var(--seal-soft); border-radius: 999px;
    padding: 5px 14px; display: inline-block; margin-bottom: 18px;
  }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 6vw, 40px); margin: 0 0 10px; }
  header p { max-width: 42ch; margin: 0 auto; color: var(--ink-dim); font-size: 14.5px; }

  /* ── ledger — a running spine down the left, entries hang off it like a
     literal logbook rather than a generic card feed ─────────────────── */
  .ledger { margin-top: 52px; position: relative; }
  .ledger::before {
    content: ""; position: absolute; left: 19px; top: 6px; bottom: 6px; width: 1.5px;
    background: var(--line);
  }
  .day-group { margin-bottom: 34px; }
  .day-label {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.05em;
    margin: 0 0 14px 0; padding-left: 46px;
  }
  .entry { position: relative; padding-left: 46px; margin-bottom: 18px; }
  .entry .node {
    position: absolute; left: 8px; top: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--paper); border: 1.5px solid var(--line); display: flex; align-items: center;
    justify-content: center; font-size: 12px;
  }
  .entry .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .entry .persona {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--seal-ink); margin-bottom: 4px;
  }
  .entry h3 { font-family: var(--serif); font-weight: 400; font-size: 16.5px; margin: 0 0 6px; }
  .entry p { font-size: 13px; color: var(--ink-dim); margin: 0; }
  .entry a.more {
    display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: 11px;
    color: var(--seal-ink); text-decoration: none; font-weight: 600;
  }
  .entry a.more:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--ink-faint); padding: 60px 4px; font-size: 14px; }
  .source-note {
    margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-align: center;
  }
  .source-note a { color: inherit; }
</style>
</head>
<body>
<a class="back-link" href="../about/">← 소개로</a>
<div class="wrap">
  <header>
    <span class="eyebrow">VIVID · WORKLOG</span>
    <h1>업무 일지</h1>
    <p>차실장·클로이 박·박새로이가 실제로 한 일을 날짜순으로 남긴다. 지어낸
      실적이 아니라, 그날 실제로 고치거나 만든 것만 적는다.</p>
  </header>

  <div class="ledger" id="ledger"></div>
  <p class="empty" id="empty" style="display:none;">아직 기록된 일지가 없습니다.</p>

  <p class="source-note">이 페이지는 <a href="entries.json">entries.json</a>을
    그대로 읽어서 그린다 — 새 항목은 그 파일에 커밋만 추가하면 반영된다.</p>
</div>

<script>
fetch('entries.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(items => {
  if (!items.length) { document.getElementById('empty').style.display = 'block'; return; }

  const byDate = new Map();
  items.forEach(it => {
    if (!byDate.has(it.date)) byDate.set(it.date, []);
    byDate.get(it.date).push(it);
  });
  const dates = [...byDate.keys()].sort((a, b) => b.localeCompare(a));

  const ledger = document.getElementById('ledger');
  dates.forEach(date => {
    const group = document.createElement('div');
    group.className = 'day-group';
    group.innerHTML = `<p class="day-label">${date}</p>`;
    byDate.get(date).forEach(it => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      const linkHtml = it.link ? `<a class="more" href="${it.link}">자세히 보기 →</a>` : '';
      entry.innerHTML = `
        <div class="node">${it.glyph || '·'}</div>
        <div class="card">
          <div class="persona">${it.persona}</div>
          <h3>${it.title}</h3>
          <p>${it.detail}</p>
          ${linkHtml}
        </div>`;
      group.appendChild(entry);
    });
    ledger.appendChild(group);
  });
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
});
</script>
</body>
</html>
